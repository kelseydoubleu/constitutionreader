<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONSTITUTION READER</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:#fff; color:#1a1a1a; font-family:'Spline Sans Mono',monospace; display:flex; flex-direction:column; height:100vh; border:14px solid #FCFF68; }

  /* TOP BAR */
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; padding:18px 28px 14px; flex-shrink:0; }
  .topbar-title { font-size:13px; letter-spacing:0.35em; font-weight:500; cursor:pointer; padding-top:2px; transition:color 0.15s; user-select:none; }
  .topbar-title:hover { color:#666; }
  .topbar-back-arrow { display:inline-block; margin-right:8px; opacity:0.55; transition:transform 0.15s, opacity 0.15s; }
  .topbar-title:hover .topbar-back-arrow { opacity:1; transform:translateX(-3px); }
  .topbar-meta { display:flex; flex-direction:column; gap:2px; align-items:flex-end; font-size:10px; letter-spacing:0.15em; }
  .topbar-meta-line { white-space:nowrap; font-weight:500; }

  /* HOME PAGE */
  .home { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; gap:64px; }
  .home-tagline { font-size:13px; letter-spacing:0.18em; color:#555; text-transform:uppercase; max-width:840px; text-align:center; line-height:2; }
  .home-tagline .line2 { color:#1a1a1a; margin-top:4px; }
  .specimen-grid { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  .specimen-card { border:1px solid #1a1a1a; padding:24px; width:240px; cursor:pointer; transition:all 0.2s; text-align:center; background:#fff; }
  .specimen-card:hover { background:#FCFF68; }
  .card-name { font-size:16px; letter-spacing:0.2em; font-weight:600; margin-bottom:6px; }
  .card-arch { font-size:11px; letter-spacing:0.2em; color:#888; margin-bottom:18px; }
  .card-cta { height:120px; border:1px solid #f0f0f0; margin-bottom:14px; display:flex; align-items:center; justify-content:center; color:#888; font-size:11px; letter-spacing:0.2em; }
  .card-score { font-size:13px; letter-spacing:0.1em; color:#777; }

  /* DETAIL PAGE */
  .detail { flex:1; display:flex; flex-direction:column; min-height:0; }
  .cr-main { flex:1; position:relative; min-height:0; }
  .cr-card { position:absolute; top:4px; left:28px; width:320px; z-index:10; display:flex; flex-direction:column; border:1px solid #1a1a1a; background:#fff; }
  .cr-card-header { padding:16px 20px 14px; border-bottom:1px solid #1a1a1a; }
  .cr-card-title { font-size:18px; letter-spacing:0.16em; font-weight:600; color:#1a1a1a; }
  .cr-card-arch { font-size:10px; letter-spacing:0.22em; color:#888; margin-top:4px; }
  .cr-card-body { padding:14px 20px 18px; }
  .cr-card-label { font-size:9px; letter-spacing:0.28em; color:#888; margin-bottom:10px; }
  .cr-card-line { font-size:12px; line-height:1.5; color:#1a1a1a; display:flex; gap:12px; padding:8px 0; border-top:1px solid #f0f0f0; }
  .cr-card-line:first-of-type { border-top:none; padding-top:0; }
  .cr-card-num { color:#aaa; font-weight:500; min-width:22px; flex-shrink:0; }
  .cr-card-text { color:#1a1a1a; }

  .cr-canvas-area { position:absolute; inset:0; }
  .cr-canvas-area #viewport { position:absolute; inset:0; }

  .bottom { flex-shrink:0; padding:12px 28px 18px; }

  /* ═══ RESPONSIVE — TABLET / MOBILE ═══ */
  @media (max-width: 720px) {
    body { border-width: 6px; }

    /* Topbar — compact, both elements still visible */
    .topbar { padding: 10px 14px 8px; }
    .topbar-title { font-size: 10px; letter-spacing: 0.18em; }
    .topbar-back-arrow { margin-right: 5px; }
    .topbar-meta { font-size: 8px; letter-spacing: 0.08em; gap: 1px; }

    /* Home — single column, scroll within content area */
    .home { padding: 24px 12px 28px; gap: 24px; overflow-y: auto; justify-content: flex-start; }
    .home-tagline { font-size: 10px; line-height: 1.7; padding: 0 6px; }
    .specimen-grid { flex-direction: column; gap: 14px; align-items: stretch; padding: 0 14px; width: 100%; }
    .specimen-card { width: 100%; max-width: 360px; padding: 18px; margin: 0 auto; }
    .card-name { font-size: 14px; letter-spacing: 0.16em; }
    .card-arch { font-size: 10px; margin-bottom: 12px; }
    .card-cta { height: 70px; font-size: 10px; margin-bottom: 10px; }
    .card-score { font-size: 12px; }

    /* Detail card sizing on mobile (used in both orientations) */
    .cr-card-header { padding: 12px 16px 10px; }
    .cr-card-title { font-size: 14px; letter-spacing: 0.12em; }
    .cr-card-arch { font-size: 9px; }
    .cr-card-body { padding: 10px 16px 14px; }
    .cr-card-label { font-size: 8px; margin-bottom: 8px; }
    .cr-card-line { font-size: 11px; padding: 6px 0; gap: 8px; }
    .cr-card-num { min-width: 20px; }

    .bottom { padding: 6px 12px 10px; }

    /* Hide individual stage labels on small screens — they collide; the centered
       current-stage indicator (#lc-stage) shows the active phase. */
    .stage-tick { display: none; }
  }

  /* Mobile PORTRAIT — stack canvas above card; canvas fills, card scrolls */
  @media (max-width: 720px) and (orientation: portrait) {
    .cr-main { display: flex; flex-direction: column; }
    .cr-canvas-area {
      position: static;
      flex: 1 1 0;
      min-height: 240px;
      order: 1;
    }
    .cr-card {
      position: static;
      width: 100%;
      left: auto;
      top: auto;
      max-height: 38vh;
      overflow-y: auto;
      order: 2;
      border-left: none;
      border-right: none;
      flex-shrink: 0;
    }
  }

  /* Mobile LANDSCAPE — keep overlay layout but shrink the card so canvas isn't crushed */
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
    .cr-card { width: 220px; left: 14px; top: 4px; max-height: calc(100vh - 110px); overflow-y: auto; }
  }

  /* Very small (≤380px) — minimal chrome */
  @media (max-width: 380px) {
    body { border-width: 4px; }
    .topbar-title { font-size: 9px; letter-spacing: 0.14em; }
    .topbar-meta { font-size: 7px; }
    .cr-card-line { font-size: 10px; }
  }
</style>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title" id="topbar-title" onclick="goHome()">CONSTITUTION READER</div>

<script type="module">
import * as THREE from 'three';

// ═══ NOISE ═══
function noise3D(x,y,z){const h=n=>{let v=Math.sin(n*127.1+n*311.7)*43758.5453;return v-Math.floor(v);};const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz),lerp=(a,b,t)=>a+t*(b-a);const v000=h(ix+iy*57+iz*113),v100=h(ix+1+iy*57+iz*113),v010=h(ix+(iy+1)*57+iz*113),v110=h(ix+1+(iy+1)*57+iz*113),v001=h(ix+iy*57+(iz+1)*113),v101=h(ix+1+iy*57+(iz+1)*113),v011=h(ix+(iy+1)*57+(iz+1)*113),v111=h(ix+1+(iy+1)*57+(iz+1)*113);return lerp(lerp(lerp(v000,v100,ux),lerp(v010,v110,ux),uy),lerp(lerp(v001,v101,ux),lerp(v011,v111,ux),uy),uz);}
function fbm(x,y,z,oct=4){let v=0,a=1,f=1,t=0;for(let i=0;i<oct;i++){v+=a*noise3D(x*f,y*f,z*f);t+=a;a*=0.5;f*=2;}return v/t;}
function displaceGeo(geo,scale,freq,seed=0){const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),len=Math.sqrt(x*x+y*y+z*z);if(len>0.01){const n=fbm(x*freq+seed,y*freq+seed*0.7,z*freq+seed*1.3);const f=1+(n-0.5)*scale;pos.setXYZ(i,x*f,y*f,z*f);}}pos.needsUpdate=true;geo.computeVertexNormals();}

// ═══ THEMES ═══
const THEMES = {
  constitutional: { name:'CONSTITUTIONAL', flow:0xE91E8C, flowLt:0xF54DAA, flowDk:0xC41070, agent:0x33DD33, agentLt:0x66EE66, agentDk:0x22AA22, time:0xFFB830, timeLt:0xFFCC55, timeDk:0xCC8800, base:0xAAAAAA, baseLt:0xCCCCCC, baseDk:0x888888, bg:0xffffff, envelope:0.78, envSat:0.15 },
  monochrome: { name:'MONOCHROME', flow:0x777777, flowLt:0x999999, flowDk:0x555555, agent:0x666666, agentLt:0x888888, agentDk:0x444444, time:0x999999, timeLt:0xAAAAAA, timeDk:0x777777, base:0xBBBBBB, baseLt:0xDDDDDD, baseDk:0x999999, bg:0xffffff, envelope:0.85, envSat:0.0 }
};
let currentTheme = THEMES.monochrome;

// ═══ MATERIALS (theme-aware) ═══
const MM={flow:o=>Object.assign({color:currentTheme.flow,roughness:0.3,transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide},o||{}),flowLt:o=>Object.assign({color:currentTheme.flowLt,roughness:0.25,transparent:true,opacity:0.28,depthWrite:false,side:THREE.DoubleSide},o||{}),flowDk:o=>Object.assign({color:currentTheme.flowDk,roughness:0.35,transparent:true,opacity:0.4,depthWrite:false,side:THREE.DoubleSide},o||{}),agent:o=>Object.assign({color:currentTheme.agent,roughness:0.3,transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide},o||{}),agentLt:o=>Object.assign({color:currentTheme.agentLt,roughness:0.25,transparent:true,opacity:0.28,depthWrite:false,side:THREE.DoubleSide},o||{}),agentDk:o=>Object.assign({color:currentTheme.agentDk,roughness:0.35,transparent:true,opacity:0.4,depthWrite:false,side:THREE.DoubleSide},o||{}),time:o=>Object.assign({color:currentTheme.time,roughness:0.3,transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide},o||{}),timeLt:o=>Object.assign({color:currentTheme.timeLt,roughness:0.25,transparent:true,opacity:0.28,depthWrite:false,side:THREE.DoubleSide},o||{}),timeDk:o=>Object.assign({color:currentTheme.timeDk,roughness:0.35,transparent:true,opacity:0.4,depthWrite:false,side:THREE.DoubleSide},o||{}),base:o=>Object.assign({color:currentTheme.base,roughness:0.4,transparent:true,opacity:0.2,depthWrite:false,side:THREE.DoubleSide},o||{}),baseLt:o=>Object.assign({color:currentTheme.baseLt,roughness:0.35,transparent:true,opacity:0.15,depthWrite:false,side:THREE.DoubleSide},o||{}),baseDk:o=>Object.assign({color:currentTheme.baseDk,roughness:0.45,transparent:true,opacity:0.25,depthWrite:false,side:THREE.DoubleSide},o||{})};

// ═══ GENERATORS ═══
function pearDeform(geo, elongate, taper) {
  const pos = geo.attributes.position;
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < pos.count; i++) { minY = Math.min(minY, pos.getY(i)); maxY = Math.max(maxY, pos.getY(i)); }

// ═══ WASP NEST LIFECYCLE: time-scrubbed construction and death ═══
let lifecycleT = 0.6;
let lifecycleMeshes = [];

function ss(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);}

function genLifecycle(g) {
  const r = R(42);
  lifecycleMeshes = [];
  const tag = (mesh, appear, peak, fade, gone) => {
    mesh.userData.lc = { appear, peak, fade, gone };
    lifecycleMeshes.push(mesh);
    return mesh;
  };

  const branch = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 8, 8),
    mt('base', { opacity: 0.3 })
  );

  branch.position.y = 5;
  g.add(tag(branch, 0, 0, 0.82, 0.95));

  for (let i = 0; i < 5; i++) {
    const sb = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.06, 1 + r() * 1.5, 5),
      mt('base', { opacity: 0.25 })
    );

    sb.rotation.z = Math.PI / 2 + (r() - 0.5) * 0.8;

    }

  }

      new THREE.BoxGeometry(0.04, 0.02, 0.2 + r() * 0.3),
      mt('flowDk', { opacity: 0.3 })
    );

        new THREE.SphereGeometry(0.025, 4, 3),
        mt('flow', { opacity: 0.5 })
      );

    const orbitHeight = -1 + r() * 6;
    const orbitSpeed = 0.3 + r() * 0.8;

    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.1, 1.5, 0.05), new THREE.Vector3(-0.05, 3.2, 0)
  ]);
  const anchorMesh = new THREE.Mesh(new THREE.TubeGeometry(ac, 12, 0.1, 8, false), mt('agentDk', { opacity: 0.5 }));
  g.add(tag(anchorMesh, 0.12, 0.3, 0.82, 0.88));

  const plateGeo = new THREE.CylinderGeometry(0.6, 0.4, 0.12, 16);
  displaceGeo(plateGeo, 0.15, 3, 99);
  const plate = new THREE.Mesh(plateGeo, mt('agentDk', { opacity: 0.4 }));
  plate.position.y = 3.3;
  g.add(tag(plate, 0.12, 0.3, 0.82, 0.88));

  const cellGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.35, 6, 1, true);
  const capGeo = new THREE.CylinderGeometry(0.20, 0.20, 0.04, 6);
  const combs = [{y:0,oR:2.5,t:0.18},{y:-2.2,oR:3.0,t:0.28},{y:-4.2,oR:3.3,t:0.35},{y:-6,oR:2.6,t:0.42},{y:-7.6,oR:1.8,t:0.48},{y:-8.8,oR:1.0,t:0.54}];

    const envAppear = 0.22 + l * 0.015;
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      opacity: 0.04 + Math.random() * 0.03,
      color: new THREE.Color().setHSL(0.1, currentTheme.envSat, currentTheme.envelope + l * 0.004),
      transparent: true, depthWrite: false, side: THREE.DoubleSide, roughness: 0.7
    }));
    m.position.y = -2;
    g.add(tag(m, envAppear, envAppear + 0.1, 0.82 - l * 0.005, 0.92 - l * 0.003));
  }

  for (let i = 0; i < 40; i++) {
    const a = r() * Math.PI * 2, d = r() * 5;
    const sz = 0.05 + r() * 0.15;
    const frag = new THREE.Mesh(
      new THREE.BoxGeometry(sz, sz * 0.3, sz),
      mt(r() > 0.5 ? 'time' : 'flow', { opacity: 0.2 })
    );
    frag.position.set(Math.cos(a) * d, -8 - r() * 2, Math.sin(a) * d);
    frag.rotation.set(r(), r(), r());
    g.add(tag(frag, 0.88, 0.93, 0.97, 1.0));
  }

  g.position.y = 2;
  updateLifecycle(lifecycleT);
}

function updateLifecycle(t) {
  lifecycleT = t;
  // Wasp-nest-specific fall: the nest detaches and drops at end of cycle
  if (currentKey === 'wasp_nest' && modelGroup && modelGroup.children[0]) {
    const fallProgress = ss(0.82, 0.92, t);
    const nestDrop = fallProgress * 6;
    modelGroup.position.y = -nestDrop;
  } else if (modelGroup) {
    modelGroup.position.y = 0;
  }

  // Coral-specific: end-of-cycle global fade — fades everything still visible
  // for a clean loop reset. Late-emerging primaries that never reached their
  // bleach phase get caught here.
  const coralEndFade = (currentKey === 'coral_reef' && t > 0.92)
    ? ss(0.92, 0.99, t) : 0;

  // Ise aging window — newly-built shrine pieces are light, darken over this many cycle units
  const ISE_AGING_WINDOW = 0.20;

  lifecycleMeshes.forEach(mesh => {
    const lc = mesh.userData.lc;
    if (!lc) return;

    // lc may be a single period object OR an array of period objects (multi-period).
    // For multi-period, take max opacity across periods and use the active period's
    // peak as the build-time anchor for aging.
    const periods = Array.isArray(lc) ? lc : [lc];
    let opacity = 0;
    let activePeak = -Infinity;
    for (const p of periods) {
      let pOp;
      if (t < p.appear) pOp = 0;
      else if (t < p.peak) pOp = ss(p.appear, p.peak, t);
      else if (t < p.fade) pOp = 1;
      else if (t < p.gone) pOp = 1 - ss(p.fade, p.gone, t);
      else pOp = 0;
      if (pOp > opacity || (pOp === opacity && pOp > 0 && p.peak > activePeak)) {
        opacity = pOp;
        activePeak = p.peak;
      }
    }

    opacity *= (1 - coralEndFade);

    // Aging color: shrine wood components start light when built and darken over time.
    // Only applies to meshes flagged with userData.ages = true (Ise shrine wood pieces).
    if (mesh.userData.ages && mesh.userData.baseColor && mesh.userData.lightColor && activePeak > -Infinity) {
      const age = t - activePeak;
      const ageFrac = Math.max(0, Math.min(1, age / ISE_AGING_WINDOW));
      mesh.material.color.copy(mesh.userData.lightColor).lerp(mesh.userData.baseColor, ageFrac);
    }

    mesh.visible = opacity > 0.01;
    const mat = mesh.material;
    if (mat) {
      if (!mat.userData) mat.userData = {};
      if (mat.userData.baseOp === undefined) mat.userData.baseOp = mat.opacity !== undefined ? mat.opacity : 1;
      if (mat.opacity !== undefined) mat.opacity = mat.userData.baseOp * opacity;
      mat.transparent = true;
    }
    if (mesh.children) {
      mesh.children.forEach(ch => {
        ch.visible = opacity > 0.01;
        if (ch.material) {
          if (!ch.material.userData) ch.material.userData = {};
          if (ch.material.userData.baseOp === undefined) ch.material.userData.baseOp = ch.material.opacity !== undefined ? ch.material.opacity : 1;
          ch.material.opacity = ch.material.userData.baseOp * opacity;
          if (ch.material.transparent === undefined) ch.material.transparent = true;
        }
      });
    }
  });
}


// ═══ CORAL REEF LIFECYCLE: continuous palimpsest — each branch ages individually ═══
function genCoralLifecycle(g) {
  const r = R(101);
  lifecycleMeshes = [];
  animatedWasps = [];

  const tag = (mesh, appear, peak, fade, gone) => {
    mesh.userData.lc = { appear, peak, fade, gone };
    lifecycleMeshes.push(mesh);
    return mesh;
  };

  // ── FOCAL CORAL BUILDER ──
  // Each PRIMARY branch (the 11 base trunks) gets its OWN random start time spread
  // across the cycle. Within a primary, depth offsets follow normally. Result: at
  // any moment, different primaries are at DIFFERENT lifecycle stages — some still
  // sprouting, some at peak with polyps, some bleaching, some skeletal. Continuous
  // turnover, not a single sequential wave.
  function buildFocalCoral(rootPos, seed, scale, livingDur, depthSpread, primarySpread) {
    const r2 = R(seed);

    function recurse(start, dir, length, thickness, depth, primaryStart) {
      if (depth > 3 || length < 0.05) return;
      const end = start.clone().add(dir.clone().multiplyScalar(length));
      const cp1 = start.clone().add(dir.clone().multiplyScalar(length * 0.3));
      cp1.add(new THREE.Vector3((r2() - 0.5) * 0.06, (r2() - 0.5) * 0.03, (r2() - 0.5) * 0.06));
      const cp2 = start.clone().add(dir.clone().multiplyScalar(length * 0.7));
      cp2.add(new THREE.Vector3((r2() - 0.5) * 0.06, (r2() - 0.5) * 0.03, (r2() - 0.5) * 0.06));
      const path = new THREE.CatmullRomCurve3([start, cp1, cp2, end]);
      const tubeGeo = new THREE.TubeGeometry(path, 8, thickness, 5, false);

      // Branch's age clock — anchored to its primary's start time, then depth offset
      const appearT = primaryStart + depth * depthSpread + r2() * 0.03;
      const bleachT = appearT + livingDur;

      // 1. LIVING TUBE — fades when this branch's bleach phase begins
      const tube = new THREE.Mesh(tubeGeo, mt('flow', { opacity: 0.5 }));
      tube.position.copy(rootPos);
      g.add(tag(tube, appearT, appearT + 0.10, bleachT, bleachT + 0.08));

      // 2. BLEACHED SKELETON OVERLAY — light wireframe, appears as branch bleaches.
      // No fade in lc (set to 1.5+ so it never naturally fades within cycle).
      // The end-of-cycle global fade in updateLifecycle handles loop reset.
      const bleachedEdges = new THREE.LineSegments(
        new THREE.EdgesGeometry(tubeGeo, 15),
        new THREE.LineBasicMaterial({ color: 0xCCCCCC, transparent: true, opacity: 0.55 })
      );
      bleachedEdges.position.copy(rootPos);
      g.add(tag(bleachedEdges, bleachT - 0.05, bleachT + 0.05, 1.5, 1.6));

      // 3. POLYPS — bleach near branch's bleach time with random offset
      for (let p = 1; p <= 3; p++) {
        const polyp = new THREE.Mesh(
          new THREE.SphereGeometry(thickness * 1.5, 5, 4),
          mt('flowDk', { opacity: 0.65 })
        );
        const tt = p / 4;
        polyp.position.copy(rootPos).add(path.getPoint(tt));
        const polypBleach = bleachT - 0.08 + r2() * 0.10;
        const polypGone = polypBleach + 0.04 + r2() * 0.03;
        g.add(tag(polyp, appearT + 0.05, appearT + 0.16, polypBleach, polypGone));
      }

      const numChildren = depth < 1 ? 4 + Math.floor(r2() * 2) : 2 + Math.floor(r2() * 2);
      for (let i = 0; i < numChildren; i++) {
        const newDir = dir.clone();
        newDir.x += (r2() - 0.5) * 0.7;
        newDir.z += (r2() - 0.5) * 0.7;
        newDir.y = Math.max(0.3, dir.y - r2() * 0.15);
        newDir.normalize();
        recurse(end, newDir, length * (0.68 + r2() * 0.12), thickness * 0.74, depth + 1, primaryStart);
      }
    }

    const numPrimary = 11;
    for (let i = 0; i < numPrimary; i++) {
      const angle = (i / numPrimary) * Math.PI * 2 + r2() * 0.3;
      const tilt = 0.2 + r2() * 0.4;
      const startPos = new THREE.Vector3(
        Math.cos(angle) * 0.15 * scale,
        0,
        Math.sin(angle) * 0.15 * scale
      );
      const startDir = new THREE.Vector3(
        Math.cos(angle) * Math.sin(tilt) * 0.6,
        Math.cos(tilt) + 0.4,
        Math.sin(angle) * Math.sin(tilt) * 0.6
      ).normalize();
      // Each primary gets a RANDOM start time across primarySpread window
      const primaryStart = r2() * primarySpread;
      recurse(startPos, startDir, 0.55 * scale, 0.13 * scale, 0, primaryStart);
    }
  }

  // ── CORAL — continuous turnover across the full cycle ──
  // primarySpread=0.55 means primaries can begin growing anywhere from t=0 to t=0.55.
  // livingDur=0.30 means a branch lives 0.30 of cycle before bleaching.
  // At any moment, you'll see some primaries still sprouting, some mature, some
  // bleaching, some skeletal — all coexisting.
  buildFocalCoral(
    new THREE.Vector3(0, 0, 0), 11, 2.4,
    0.30,   // livingDur
    0.06,   // depthSpread
    0.55    // primarySpread — primaries born randomly across this window
  );

  // ── BLEACHING CLOUD — released zooxanthellae drifting up throughout the cycle ──
  for (let i = 0; i < 100; i++) {
    const a = r() * Math.PI * 2;
    const d = 0.5 + r() * 2.8;
    const h = 0.3 + r() * 4.0;
    const cloudGeo = new THREE.OctahedronGeometry(0.04 + r() * 0.04, 0);
    const cloud = new THREE.Mesh(cloudGeo, new THREE.MeshStandardMaterial({
      color: 0xffffff,
      transparent: true, opacity: 0.5,
      depthWrite: false, roughness: 0.7
    }));
    cloud.position.set(Math.cos(a) * d, h, Math.sin(a) * d);
    // Cloud drifts throughout the cycle since bleaching is continuous
    const cloudAppear = 0.30 + r() * 0.55;
    g.add(tag(cloud, cloudAppear, cloudAppear + 0.04, cloudAppear + 0.10, cloudAppear + 0.18));
  }

  g.position.y = 0;
  updateLifecycle(lifecycleT);
}


// ═══ ISE SHRINE LIFECYCLE: shikinen sengū — 20-year alternation between two adjacent sites ═══
// Site A starts active (already standing from a previous cycle), gets dismantled in second half.
// Site B starts empty (kodenchi post only), gets built in first half. They swap places.
// At loop reset, we're back to the start (A active, B empty) — the visual jump represents
// the next 20 years passing. The cycle is metronomic, not smooth — that's the point.
function genIseShrine(g) {
  const r = R(202);
  lifecycleMeshes = [];
  animatedWasps = [];

  const tag = (mesh, ...args) => {
    // Two call patterns supported:
    //   tag(mesh, a, p, f, g)              → 4 numbers, single period
    //   tag(mesh, [a,p,f,g], [a,p,f,g])    → N arrays, multi-period (after spread of array-of-arrays)
    let periods;
    if (args.length > 0 && Array.isArray(args[0])) {
      periods = args.map(([a,p,f,g]) => ({appear: a, peak: p, fade: f, gone: g}));
    } else {
      const [a,p,f,g] = args;
      periods = [{appear: a, peak: p, fade: f, gone: g}];
    }
    mesh.userData.lc = periods;
    if (mesh.material && mesh.material.color) {
      mesh.userData.baseColor = mesh.material.color.clone();
      const white = new THREE.Color(0xFFFFFF);
      // Light variant: 70% toward white from base — fresh hinoki
      mesh.userData.lightColor = mesh.userData.baseColor.clone().lerp(white, 0.72);
    }
    lifecycleMeshes.push(mesh);
    return mesh;
  };
  // Variant: marks the mesh as a shrine wood component that ages from light to dark.
  const tagAge = (mesh, ...args) => {
    tag(mesh, ...args);
    mesh.userData.ages = true;
    return mesh;
  };
  const persist = mesh => tag(mesh, -0.5, -0.4, 1.5, 1.6);

  // Building dimensions (shinmei-zukuri proportions — long ridge, steep roof, raised platform)
  const W = 3.6, D = 2.0;       // W = long axis (X, ridge runs this way), D = short axis (Z)
  const PLATFORM_H = 0.15;
  const FLOOR_Y = 0.85;          // raised platform — hottate-bashira
  const WALL_H = 1.25;
  const WALL_TOP_Y = FLOOR_Y + PLATFORM_H + WALL_H;  // 2.25
  const RIDGE_Y = 3.7;           // steep roof, ridge well above wall top
  const EAVE_OVERHANG = 0.4;
  const SITE_A_X = -3.8;
  const SITE_B_X = 3.8;

  // ─── Wood grain texture (procedural canvas, shared across all wood materials) ───
  // White base × subtle dark streaks → multiplies into base color, so grain reads as
  // slightly darker veins of whatever color the wood happens to be (works in both
  // monochrome and pink themes, and stays correct as aging lerps the base color).
  const grainTex = (() => {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 256, 256);
    // Long wavering streaks roughly along U
    for (let i = 0; i < 38; i++) {
      const y = r() * 256;
      const op = 0.05 + r() * 0.10;
      x.strokeStyle = `rgba(0,0,0,${op})`;
      x.lineWidth = 0.4 + r() * 0.7;
      x.beginPath();
      x.moveTo(0, y);
      for (let xp = 0; xp <= 256; xp += 4) {
        x.lineTo(xp, y + Math.sin(xp * 0.045 + i * 0.6) * 1.8 + (r() - 0.5) * 0.6);
      }
      x.stroke();
    }
    // A few small knot rings for character
    for (let i = 0; i < 4; i++) {
      const cx = r() * 256, cy = r() * 256;
      const rad = 0.8 + r() * 1.5;
      x.strokeStyle = `rgba(0,0,0,${0.10 + r() * 0.08})`;
      x.lineWidth = 0.5;
      x.beginPath(); x.arc(cx, cy, rad, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.arc(cx, cy, rad * 1.7, 0, Math.PI * 2); x.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2, 2);
    t.anisotropy = 4;
    return t;
  })();

  // ─── Helper: build one full shrine at a position with given lifecycle timings ───
  function buildShrine(siteX, lcs) {
    const withGrain = m => { m.map = grainTex; return m; };
    const wood     = () => withGrain(mt('flow',   { opacity: 0.55 }));
    const woodLt   = () => withGrain(mt('flowLt', { opacity: 0.50 }));
    const woodDk   = () => withGrain(mt('flowDk', { opacity: 0.65 }));
    const thatchMat = () => withGrain(mt('flowDk', { opacity: 0.78 }));

    // 1. PILLARS (hottate-bashira) — 6 corner+mid posts driven directly into ground.
    // Positions span the rectangular footprint (corners + mid-long-sides).
    const postPositions = [
      [-W/2, -D/2], [W/2, -D/2],
      [-W/2,  D/2], [W/2,  D/2],
      [0, -D/2],    [0,  D/2],     // mid-long-sides
    ];
    postPositions.forEach(([x, z]) => {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.06, WALL_TOP_Y, 8),
        wood()
      );
      post.position.set(siteX + x, WALL_TOP_Y / 2, z);
      g.add(tagAge(post, ...lcs.posts));
    });

    // 2. PLATFORM (raised wooden floor — takayuka style)
    // Extends BEYOND the walls in all directions: in shinmei-zukuri the floor's edge
    // forms the wraparound walkway (what's read as "veranda"). Stairs land on this edge.
    const PLATFORM_OVER_X = 0.30;   // platform overhangs walls by this much in +X/−X
    const PLATFORM_OVER_Z = 0.25;   // ...and by this in +Z/−Z
    const platform = new THREE.Mesh(
      new THREE.BoxGeometry(W + PLATFORM_OVER_X * 2, PLATFORM_H, D + PLATFORM_OVER_Z * 2),
      woodLt()
    );
    platform.position.set(siteX, FLOOR_Y + PLATFORM_H / 2, 0);
    g.add(tagAge(platform, ...lcs.platform));

    // 3. MUNAMOCHI-BASHIRA — free-standing pillars at GABLE ENDS (±X) supporting the ridge.
    // Characteristic of shinmei-zukuri: visible OUTSIDE the gable wall, going to the apex.
    [-W/2 - 0.18, W/2 + 0.18].forEach(x => {
      const munamochi = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.09, RIDGE_Y, 10),
        wood()
      );
      munamochi.position.set(siteX + x, RIDGE_Y / 2, 0);
      g.add(tagAge(munamochi, ...lcs.munamochi));
    });

    // 4. ROOF STRUCTURE — gabled, ridge runs along X. Two slopes pitch in ±Z.
    // Slopes meet at ridge (z=0, y=RIDGE_Y), descend to eaves at y=WALL_TOP_Y, z=±roofRun.
    const roofWidth = W + 0.2;     // slight gable extension beyond wall
    const roofRise = RIDGE_Y - WALL_TOP_Y;
    const roofRun = D / 2 + EAVE_OVERHANG;
    const slopeLen = Math.sqrt(roofRise * roofRise + roofRun * roofRun);
    const slopeAngle = Math.atan2(roofRise, roofRun);
    [+1, -1].forEach(side => {
      const slope = new THREE.Mesh(
        new THREE.BoxGeometry(roofWidth, 0.08, slopeLen),
        wood()
      );
      slope.position.set(siteX, (RIDGE_Y + WALL_TOP_Y) / 2, side * roofRun / 2);
      slope.rotation.x = side * slopeAngle;   // FIXED: outer eave goes DOWN, inner ridge UP
      g.add(tagAge(slope, ...lcs.roof));
    });

    // Ridge beam — visible spine along X at the apex, where katsuogi sit on top
    const ridgeBeam = new THREE.Mesh(
      new THREE.BoxGeometry(W + 0.3, 0.10, 0.10),
      woodDk()
    );
    ridgeBeam.position.set(siteX, RIDGE_Y, 0);
    g.add(tagAge(ridgeBeam, ...lcs.roof));

    // 5. WALLS
    // 5a. Long-side walls (at z = ±D/2) — solid
    [-D/2 + 0.025, D/2 - 0.025].forEach(z => {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(W - 0.08, WALL_H, 0.05),
        wood()
      );
      wall.position.set(siteX, FLOOR_Y + PLATFORM_H + WALL_H / 2, z);
      g.add(tagAge(wall, ...lcs.walls));
    });
    // 5b. Gable-end walls (at x = ±W/2) — front (+X) has door for tsumairi entry
    [-W/2 + 0.025, W/2 - 0.025].forEach((x, idx) => {
      const isFront = idx === 1;
      if (isFront) {
        const doorWidth = 0.7;
        const sideWidth = (D - doorWidth - 0.08) / 2;
        [-1, 1].forEach(s => {
          const wall = new THREE.Mesh(
            new THREE.BoxGeometry(0.05, WALL_H, sideWidth),
            wood()
          );
          wall.position.set(siteX + x, FLOOR_Y + PLATFORM_H + WALL_H / 2, s * (doorWidth/2 + sideWidth/2));
          g.add(tagAge(wall, ...lcs.walls));
        });
        const lintel = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.22, doorWidth),
          wood()
        );
        lintel.position.set(siteX + x, FLOOR_Y + PLATFORM_H + WALL_H - 0.11, 0);
        g.add(tagAge(lintel, ...lcs.walls));
      } else {
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, WALL_H, D - 0.08),
          wood()
        );
        wall.position.set(siteX + x, FLOOR_Y + PLATFORM_H + WALL_H / 2, 0);
        g.add(tagAge(wall, ...lcs.walls));
      }
    });
    // 5c. Gable triangle walls — fill the peak from wall_top up to ridge at each gable end.
    // Base extends to the eave line (±roofRun), so the triangle's slopes match the roof slopes.
    [-W/2 - 0.02, W/2 + 0.02].forEach(gableX => {
      const triGeo = new THREE.BufferGeometry();
      const verts = new Float32Array([
        0, 0, -roofRun,
        0, 0,  roofRun,
        0, RIDGE_Y - WALL_TOP_Y, 0
      ]);
      triGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      triGeo.setIndex([0, 1, 2]);
      triGeo.computeVertexNormals();
      const gableTri = new THREE.Mesh(triGeo, wood());
      gableTri.position.set(siteX + gableX, WALL_TOP_Y, 0);
      g.add(tagAge(gableTri, ...lcs.walls));
    });

    // 6. CHIGI — X-crossed beams projecting up from the GABLE ENDS (±W/2)
    // The X is in the Y-Z plane (gable plane), so rotation around X-axis.
    const chigiLen = 1.6;
    const chigiAngle = Math.PI / 6;  // 30° from vertical
    [-W/2 - 0.05, W/2 + 0.05].forEach(x => {
      [+1, -1].forEach(direction => {
        const beam = new THREE.Mesh(
          new THREE.BoxGeometry(0.07, chigiLen, 0.13),  // long axis Y
          woodDk()
        );
        beam.position.set(siteX + x, RIDGE_Y + 0.20, 0);
        beam.rotation.x = direction * chigiAngle;     // rotate in Y-Z plane
        g.add(tagAge(beam, ...lcs.chigi));
      });
    });

    // 7. KATSUOGI — round logs on ridge, spaced ALONG X (ridge), each lying ALONG Z (perpendicular)
    const numKatsuogi = 10;
    const katsuogiLen = 0.6;
    const ridgeSpan = W * 0.82;
    const ridgeSpacing = ridgeSpan / (numKatsuogi - 1);
    for (let i = 0; i < numKatsuogi; i++) {
      const x = -ridgeSpan/2 + i * ridgeSpacing;
      const log = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, katsuogiLen, 8),
        wood()
      );
      log.position.set(siteX + x, RIDGE_Y + 0.12, 0);
      log.rotation.x = Math.PI / 2;   // rotate cylinder default-Y axis to lie along Z
      g.add(tagAge(log, ...lcs.katsuogi));
    }

    // 8. THATCH — overlay slightly larger and offset above the roof structure
    [+1, -1].forEach(side => {
      const thatch = new THREE.Mesh(
        new THREE.BoxGeometry(roofWidth + 0.15, 0.18, slopeLen + 0.08),
        thatchMat()
      );
      thatch.position.set(siteX, (RIDGE_Y + WALL_TOP_Y) / 2 + 0.10, side * roofRun / 2);
      thatch.rotation.x = side * slopeAngle;     // FIXED: matches roof rotation
      g.add(tagAge(thatch, ...lcs.thatch));
    });

    // 9. VERANDA — narrow base band beneath the platform, between the posts.
    // Shrunk to match the walls in plan: the platform's overhang is the wraparound
    // walkway now, so the veranda just functions as a low foundation trim.
    const veranda = new THREE.Mesh(
      new THREE.BoxGeometry(W, 0.08, D),
      woodLt()
    );
    veranda.position.set(siteX, FLOOR_Y - 0.10, 0);
    g.add(tagAge(veranda, ...lcs.veranda));

    // 10. STAIRS (kizahashi) — at +X gable end, leading up to the PLATFORM EDGE.
    // The platform overhangs the walls by PLATFORM_OVER_X. The top step sits OUTSIDE
    // the overhang (its near edge meets the platform's far edge), so the step's body
    // doesn't penetrate up through the platform. Top tread is coplanar with platform top.
    const STAIR_COUNT = 3;
    const PLATFORM_TOP_Y = FLOOR_Y + PLATFORM_H;        // 1.0
    const PLATFORM_X_EDGE = W/2 + PLATFORM_OVER_X;      // outermost edge of platform overhang
    const STAIR_WIDTH_X = 0.20;
    const STAIR_X_STEP = 0.20;
    const STAIR_DEPTH = 0.85;
    // Top step's NEAR edge meets the platform far edge → top step xCenter sits one half-width outward.
    const STAIR_TOP_XCENTER = PLATFORM_X_EDGE + STAIR_WIDTH_X / 2;
    for (let i = 0; i < STAIR_COUNT; i++) {
      // i=0 → lowest, furthest from building.  i=STAIR_COUNT-1 → tallest, at the platform edge.
      const treadTop = (i + 1) * (PLATFORM_TOP_Y / STAIR_COUNT);
      const xOffset = STAIR_TOP_XCENTER + (STAIR_COUNT - 1 - i) * STAIR_X_STEP;
      const step = new THREE.Mesh(
        new THREE.BoxGeometry(STAIR_WIDTH_X, treadTop, STAIR_DEPTH),
        wood()
      );
      step.position.set(siteX + xOffset, treadTop / 2, 0);
      g.add(tagAge(step, ...lcs.stairs));
    }

    // 11. SITE GROUND PLOT (always visible — the consecrated ground)
    const plot = new THREE.Mesh(
      new THREE.BoxGeometry(W + 1.6, 0.05, D + 1.4),
      mt('base', { opacity: 0.25 })
    );
    plot.position.set(siteX, -0.03, 0);
    g.add(persist(plot));

    // 12. KODENCHI POST (shin-no-mihashira) — single post at center of empty site
    const kodenchi = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 0.55, 8),
      woodDk()
    );
    kodenchi.position.set(siteX, 0.275, 0);
    g.add(tag(kodenchi, ...lcs.kodenchi));

    // 13. HINOKI LOGS (raw materials before construction) — piled at +X end, beyond stairs
    if (lcs.hinoki) {
      for (let i = 0; i < 6; i++) {
        const log = new THREE.Mesh(
          new THREE.CylinderGeometry(0.08, 0.08, 1.6, 6),
          wood()
        );
        const row = Math.floor(i / 3), col = i % 3;
        log.position.set(siteX + W/2 + 1.2 + row * 0.18, 0.08, (col - 1) * 0.22);
        log.rotation.x = Math.PI / 2;   // lie along Z
        log.rotation.y = (r() - 0.5) * 0.08;
        g.add(tag(log, ...lcs.hinoki));
      }
    }

    // 14. REDISTRIBUTION PARTICLES (timber drifting outward to other shrines during dismantle)
    if (lcs.redist) {
      for (let i = 0; i < 35; i++) {
        const a = r() * Math.PI * 2;
        const dist = 2.0 + r() * 2.5;
        const h = 0.4 + r() * 2.5;
        const p = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.05 + r() * 0.04, 0),
          mt('flow', { opacity: 0.55 })
        );
        p.position.set(siteX + Math.cos(a) * dist, h, Math.sin(a) * dist);
        const offset = r() * (lcs.redist[2] - lcs.redist[0] - 0.05);
        const start = lcs.redist[0] + offset;
        g.add(tag(p, start, start + 0.03, start + 0.08, start + 0.13));
      }
    }
  }

  // ═══ LIFECYCLE TIMING — 40-year cycle (two sengū per loop) ═══
  // Half-cycle 1 (0-0.5): A standing → build B → ceremony → dismantle A → A empty.
  // Half-cycle 2 (0.5-1): B standing → build A → ceremony → dismantle B → B empty.
  // At t=1.0, the rebuilt A stands fully aged with B empty kodenchi — identical to t=0.
  // Loop is seamless: no plot switch, the "new" shrine simply becomes the next "old."
  //
  // For Site A, each component has TWO periods:
  //   period 1: visible from start, fades during first dismantle (0.34-0.46)
  //   period 2: appears during rebuild (0.55-0.80), persists past the loop (fade 1.5)
  // The aging system uses the active period's peak as the build-time anchor.
  const A_LCS = {
    posts:     [[-0.5, -0.4, 0.44, 0.46], [0.58, 0.60, 1.5, 1.6]],
    platform:  [[-0.5, -0.4, 0.43, 0.45], [0.61, 0.63, 1.5, 1.6]],
    munamochi: [[-0.5, -0.4, 0.41, 0.43], [0.64, 0.66, 1.5, 1.6]],
    roof:      [[-0.5, -0.4, 0.39, 0.41], [0.66, 0.68, 1.5, 1.6]],
    walls:     [[-0.5, -0.4, 0.37, 0.39], [0.69, 0.71, 1.5, 1.6]],
    chigi:     [[-0.5, -0.4, 0.36, 0.38], [0.71, 0.73, 1.5, 1.6]],
    katsuogi:  [[-0.5, -0.4, 0.35, 0.37], [0.73, 0.75, 1.5, 1.6]],
    thatch:    [[-0.5, -0.4, 0.34, 0.36], [0.75, 0.77, 1.5, 1.6]],
    veranda:   [[-0.5, -0.4, 0.42, 0.44], [0.77, 0.80, 1.5, 1.6]],
    stairs:    [[-0.5, -0.4, 0.42, 0.44], [0.77, 0.80, 1.5, 1.6]],
    kodenchi:  [0.46, 0.48, 0.55, 0.57],     // single period — only visible during empty middle
    hinoki:    [0.55, 0.58, 0.66, 0.70],     // logs at A for second-half rebuild only
    redist:    [0.34, 0.36, 0.46, 0.48],     // particles drift outward during first-half dismantle
  };

  // For Site B, components have a single period (built first half, dismantled second half).
  // Kodenchi has TWO periods: visible at start (before B build) AND at end (after B dismantle).
  const B_LCS = {
    posts:     [0.06, 0.08, 0.94, 0.96],
    platform:  [0.09, 0.11, 0.93, 0.95],
    munamochi: [0.13, 0.15, 0.91, 0.93],
    roof:      [0.16, 0.18, 0.89, 0.91],
    walls:     [0.19, 0.21, 0.87, 0.89],
    chigi:     [0.21, 0.23, 0.86, 0.88],
    katsuogi:  [0.23, 0.25, 0.85, 0.87],
    thatch:    [0.25, 0.27, 0.84, 0.86],
    veranda:   [0.27, 0.30, 0.92, 0.94],
    stairs:    [0.27, 0.30, 0.92, 0.94],
    kodenchi:  [[-0.5, -0.4, 0.06, 0.08], [0.96, 0.98, 1.5, 1.6]],   // multi: at start AND end
    hinoki:    [0.03, 0.06, 0.16, 0.20],     // logs at B for first-half build
    redist:    [0.84, 0.86, 0.96, 0.98],     // particles drift outward during second-half dismantle
  };

  buildShrine(SITE_A_X, A_LCS);
  buildShrine(SITE_B_X, B_LCS);

  // ═══ SENGYO CEREMONIES — kami transfer (twice per cycle) ═══
  // First sengyo (~t=0.32): A → B, after B is fully complete and before A dismantles.
  // Second sengyo (~t=0.82): B → A, after A is rebuilt and before B dismantles.
  [
    { startBaseT: 0.32, fromX: SITE_A_X, toX: SITE_B_X },
    { startBaseT: 0.82, fromX: SITE_B_X, toX: SITE_A_X },
  ].forEach(({ startBaseT, fromX, toX }) => {
    for (let i = 0; i < 12; i++) {
      const tProgress = i / 11;
      const x = fromX + (toX - fromX) * tProgress;
      const arc = Math.sin(tProgress * Math.PI) * 1.1;
      const sengyo = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.08, 0),
        mt('time', { opacity: 0.75 })
      );
      sengyo.position.set(x, 1.7 + arc, 0);
      const startT = startBaseT + i * 0.005;
      g.add(tag(sengyo, startT, startT + 0.02, startT + 0.05, startT + 0.08));
    }
  });

  updateLifecycle(lifecycleT);
}

const BASE_SPECIMENS = ['wasp_nest', 'coral_reef', 'ise_shrine'];

// ═══ STATE ═══
let currentPage = 'home';
let currentKey = null;
let currentMode = 'ghosted';
let lifecyclePlaying = true;
let isScrubbing = false;

// ═══ THREE.JS ═══
let scene, camera, renderer, modelGroup;
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
let sectionEnabled = false;

let camRotY = 0.8, camRotX = 0.4;
let camZoom = 11;
let camPanX = 0, camPanY = 0;
let camTarget = [0, 0, 0];
let isDragging = false, isPanning = false;
let dragStart = { x: 0, y: 0 };
let autoRotate = true;
let autoRotSpeed = 0.002;
let elapsed = 0;

function initThree() {
  const vp = document.getElementById('viewport');
  if (!vp) return;
  scene = new THREE.Scene(); scene.background = new THREE.Color(currentTheme.bg);
  camera = new THREE.OrthographicCamera(-10,10,7.5,-7.5,-100,300);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.sortObjects = true; renderer.localClippingEnabled = true;
  vp.innerHTML = ''; vp.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.75));
  [[10,18,10,0.5],[-8,10,-6,0.2],[0,5,15,0.15]].forEach(([x,y,z,i])=>{const d=new THREE.DirectionalLight(0xffffff,i);d.position.set(x,y,z);scene.add(d);});
  modelGroup = new THREE.Group(); scene.add(modelGroup);

  const canvas = renderer.domElement;
  canvas.style.cursor = 'grab';

  canvas.addEventListener('mousedown', e => {
    if (e.shiftKey || e.button === 2) { isPanning = true; } else { isDragging = true; }
    dragStart = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = isPanning ? 'move' : 'grabbing';
    autoRotate = false;
  });

  canvas.addEventListener('mousemove', e => {
    if (isDragging) {
      const dx = (e.clientX - dragStart.x) * 0.005;
      const dy = (e.clientY - dragStart.y) * 0.005;
      camRotY += dx;
      camRotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camRotX + dy));
      dragStart = { x: e.clientX, y: e.clientY };
      updateCamera();
    }
    if (isPanning) {
      const dx = (e.clientX - dragStart.x) * 0.02;
      const dy = (e.clientY - dragStart.y) * 0.02;
      camPanX -= dx;
      camPanY += dy;
      dragStart = { x: e.clientX, y: e.clientY };
      updateCamera();
    }
  });

  canvas.addEventListener('mouseup', () => {
    isDragging = false; isPanning = false;
    canvas.style.cursor = 'grab';
    setTimeout(() => { if (!isDragging) autoRotate = true; }, 2000);
  });

  canvas.addEventListener('mouseleave', () => {
    isDragging = false; isPanning = false;
    canvas.style.cursor = 'grab';
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const maxZ = (SPECS[currentKey] && SPECS[currentKey].maxZoom) || 25;
    const minZ = (SPECS[currentKey] && SPECS[currentKey].minZoom) || 3;
    camZoom = Math.max(minZ, Math.min(maxZ, camZoom + (e.deltaY > 0 ? 0.8 : -0.8)));
    updateCamera();
  }, { passive: false });

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  let lastTouchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      isDragging = false;
      lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
    autoRotate = false;
  });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = (e.touches[0].clientX - dragStart.x) * 0.005;
      const dy = (e.touches[0].clientY - dragStart.y) * 0.005;
      camRotY += dx;
      camRotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camRotX + dy));
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateCamera();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const maxZ = (SPECS[currentKey] && SPECS[currentKey].maxZoom) || 25;
      const minZ = (SPECS[currentKey] && SPECS[currentKey].minZoom) || 3;
      camZoom = Math.max(minZ, Math.min(maxZ, camZoom + (lastTouchDist - dist) * 0.05));
      lastTouchDist = dist;
      updateCamera();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    isDragging = false;
    setTimeout(() => { if (!isDragging) autoRotate = true; }, 2000);
  });

  onResize();

  (function animate() {
    requestAnimationFrame(animate);
    elapsed += 0.016;
    if (autoRotate) { camRotY += autoRotSpeed; updateCamera(); }

    // Auto-play lifecycle
    if (lifecyclePlaying && !isScrubbing && currentKey && SPECS[currentKey] && SPECS[currentKey].isLifecycle) {
      lifecycleT += 0.0005; // ~33 second cycle (2-swap means two sengū per loop)
      if (lifecycleT > 1) lifecycleT = 0;
      updateLifecycle(lifecycleT);
      const scrubber = document.getElementById('lc-scrubber');
      if (scrubber) scrubber.value = lifecycleT;
      const stageLabel = document.getElementById('lc-stage');
      if (stageLabel) {
        const stages = SPECS[currentKey].stages || [];
        if (stages.length) {
          const st = stages.reduce((best, s) => lifecycleT >= s.t ? s : best, stages[0]);
          stageLabel.textContent = st.label;
          stageLabel.style.color = st.color;
        }
      }
    }

    animatedWasps.forEach(w => {
      if (!w.mesh.visible) return;
      const o = w.orbit, t = elapsed * o.speed + o.phase;
      w.mesh.position.set(Math.cos(t) * o.radius, o.height + Math.sin(elapsed * o.bobSpeed + o.phase) * o.bobAmount, Math.sin(t) * o.radius);
      w.mesh.rotation.y = -t + Math.PI / 2; w.mesh.rotation.x = o.tilt;
      if (w.mesh.children[2]) w.mesh.children[2].rotation.z = 0.2 + Math.sin(elapsed * 25 + o.phase) * 0.3;
      if (w.mesh.children[3]) w.mesh.children[3].rotation.z = -0.2 - Math.sin(elapsed * 25 + o.phase) * 0.3;
    });
    renderer.render(scene, camera);
  })();
}

function updateCamera() {
  if (!camera) return;
  const dist = 20;
  const x = Math.sin(camRotY) * Math.cos(camRotX) * dist;
  const y = Math.sin(camRotX) * dist;
  const z = Math.cos(camRotY) * Math.cos(camRotX) * dist;
  camera.position.set(x + camPanX, y + camPanY, z);
  camera.lookAt(camPanX + camTarget[0], camPanY + camTarget[1], camTarget[2]);

  const vp = document.getElementById('viewport');
  if (!vp) return;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (w === 0 || h === 0) return;
  const a = w / h;
  camera.left = -camZoom * a; camera.right = camZoom * a;
  camera.top = camZoom; camera.bottom = -camZoom;
  camera.updateProjectionMatrix();
}

function onResize() {
  const vp = document.getElementById('viewport');
  if (!vp || !renderer) return;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h);
  updateCamera();
}

function loadModel(key) {
  if (!modelGroup) return;
  while (modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
  animatedWasps = [];
  lifecycleMeshes = [];
  scene.background = new THREE.Color(currentTheme.bg);
  const spec = SPECS[key];
  if (spec) {
    spec.fn(modelGroup);
    applyMode();
    if (sectionEnabled) applySection();
    camTarget = spec.tgt || [0, 0, 0];
    camPanX = 0; camPanY = 0;
    camZoom = spec.zoom || 11;
    const c = spec.cam;
    camRotY = Math.atan2(c[0], c[2]);
    camRotX = Math.atan2(c[1], Math.sqrt(c[0] * c[0] + c[2] * c[2]));
    updateCamera();
  }
}

function applyMode() {
  const toRemove = [];
  modelGroup.traverse(ch => { if(ch.userData._modeOverlay) toRemove.push(ch); });
  toRemove.forEach(ch => ch.parent.remove(ch));
  lifecycleMeshes = lifecycleMeshes.filter(m => !m.userData._modeOverlay);
  modelGroup.traverse(ch => { if(ch.isMesh && ch.userData._hidden) { ch.visible=true; ch.userData._hidden=false; } });
  if (currentMode === 'xray') return;
  const isDark = currentTheme.bg < 0x888888;
  const edgeColor = isDark ? 0x888888 : 0x333333;
  if (currentMode === 'ghosted') {
    modelGroup.traverse(ch => {
      if(!ch.isMesh||!ch.geometry) return;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(ch.geometry,15), new THREE.LineBasicMaterial({color:edgeColor,transparent:true,opacity:0.15}));
      edges.position.copy(ch.position);edges.rotation.copy(ch.rotation);edges.scale.copy(ch.scale);
      edges.userData._modeOverlay=true;
      if(ch.userData.lc){edges.userData.lc=ch.userData.lc;lifecycleMeshes.push(edges);}
      ch.parent.add(edges);
    });
  }
}

function applySection() {
  modelGroup.traverse(ch => {
    if(ch.isMesh && ch.material) {
      ch.material.clippingPlanes = sectionEnabled ? [clipPlane] : [];
      ch.material.needsUpdate = true;
    }
  });
}

// ═══ NAVIGATION ═══
function goHome() {
  currentPage = 'home'; currentKey = null;
  render();
}

function goDetail(key) {
  currentPage = 'detail'; currentKey = key;
  render();
  requestAnimationFrame(() => {
    if (!renderer) initThree(); else {
      const vp = document.getElementById('viewport');
      if (vp && !vp.querySelector('canvas')) vp.appendChild(renderer.domElement);
      onResize();
    }
    loadModel(key);
  });
}

// ═══ SCORE DISPLAY ═══
function scoreBar(scores) {
  // Average only numeric scores; n/a is excluded from the average rather than counted as 0.
  const nums = [scores.death, scores.waste, scores.labor, scores.supply].filter(v => typeof v === 'number');
  if (nums.length === 0) return `<span style="font-size:13px;letter-spacing:0.1em;color:#999">— /10</span>`;
  const total = nums.reduce((a, b) => a + b, 0) / nums.length;
  const pct = Math.round(total);
  return `<span style="font-size:13px;letter-spacing:0.1em;color:${pct>6?'#33DD33':pct>3?'#FFB830':'#E91E8C'}">${pct}/10</span>`;
}

function scoreDetail(scores) {
  const items = [['DEATH',scores.death],['WASTE',scores.waste],['LABOR',scores.labor],['SUPPLY',scores.supply]];
  return items.map(([k,v]) => {
    if (typeof v !== 'number') return `<span style="color:#999">${k}: ${v}</span>`;
    const color = v>6?'#33DD33':v>3?'#FFB830':'#E91E8C';
    return `<span style="color:${color}">${k}: ${v}/10</span>`;
  }).join('  ');
}

  // Topbar title: prefix with a back-arrow on detail pages so the click affordance is obvious.

      ? '<span class="topbar-back-arrow">←</span>CONSTITUTION READER'

  }

  if (currentPage === 'home') {
    if (topbarMeta) topbarMeta.innerHTML = '';
    main.innerHTML = `
      <div class="home">
        <div class="home-tagline">
          Meaning determines what a system leaves behind.<br/>
          <span class="line2">What a thing believes in is what it does with its waste, its labor, and its death.</span>
        </div>
        <div class="specimen-grid" id="home-grid"></div>
      </div>
    `;
    const grid = document.getElementById('home-grid');
    BASE_SPECIMENS.forEach(key => {
      const spec = SPECS[key];
      const scores = VALUE_SCORES[key];
      const card = document.createElement('div');
      card.className = 'specimen-card';
      card.onclick = () => goDetail(key);
      card.innerHTML = `
        <div class="card-name">${spec.name}</div>
        <div class="card-arch">${spec.arch}</div>
        <div class="card-cta">CLICK TO READ</div>
        <div class="card-score">${scoreBar(scores)}</div>
      `;
      grid.appendChild(card);
    });
  }

  if (currentPage === 'detail') {
    const spec = SPECS[currentKey];
    const isLC = !!spec.isLifecycle;
    const scores = VALUE_SCORES[currentKey];

    // Stacked scores in topbar
    if (topbarMeta) {
      const items = [['DEATH', scores.death], ['WASTE', scores.waste], ['LABOR', scores.labor], ['SUPPLY', scores.supply]];
      topbarMeta.innerHTML = items.map(([k, v]) => {
        if (typeof v !== 'number') {
          return `<div class="topbar-meta-line" style="color:#999">${k}: ${v}</div>`;
        }
        const color = v > 6 ? '#33DD33' : v > 3 ? '#FFB830' : '#E91E8C';
        return `<div class="topbar-meta-line" style="color:${color}">${k}: ${v}/10</div>`;
      }).join('');
    }

    const constitutionHTML = (spec.constitution && spec.constitution.length) ? spec.constitution.map((line, i) => `
      <div class="cr-card-line">
        <span class="cr-card-num">${String(i+1).padStart(2,'0')}</span>
        <span class="cr-card-text">${line}</span>
      </div>
    `).join('') : '';

    main.innerHTML = `
      <div class="detail">
        <div class="cr-main">
          <div class="cr-card">
            <div class="cr-card-header">
              <div class="cr-card-title">${spec.name}</div>
              <div class="cr-card-arch">${spec.arch}</div>
            </div>
            <div class="cr-card-body">
              <div class="cr-card-label">THE CONSTITUTION</div>
              ${constitutionHTML}
            </div>
          </div>
          <div class="cr-canvas-area"><div id="viewport"></div></div>
        </div>
        <div class="bottom" id="bottom-section"></div>
      </div>
    `;

    renderBottom(spec, isLC);
  }
}

function renderBottom(spec, isLC) {
  const el = document.getElementById('bottom-section');
  if (!el) return;
  if (isLC) {
    const stages = spec.stages || [];
    // Position labels at their actual t-value percentages (not evenly distributed)
    // so the scrubber thumb position aligns with the stage label and animation.
    const labelTransform = t => {
      if (t < 0.04) return 'translateX(0)';
      if (t > 0.96) return 'translateX(-100%)';
      return 'translateX(-50%)';
    };
    const ticksHTML = stages.map(s =>
      `<div style="position:absolute;left:${s.t * 100}%;width:1px;height:5px;background:#bbb;transform:translateX(-0.5px)"></div>`
    ).join('');
    const labelsHTML = stages.map(s =>
      `<span data-t="${s.t}" data-label="${s.label}" data-color="${s.color}" class="stage-tick" style="position:absolute;left:${s.t * 100}%;transform:${labelTransform(s.t)};font-size:8px;letter-spacing:0.06em;color:${s.color};text-transform:uppercase;cursor:pointer;white-space:nowrap">${s.label}</span>`
    ).join('');
    el.innerHTML = `
      <div style="padding:4px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:10px;letter-spacing:0.2em;color:#555;font-weight:500">LIFESPAN:</span>
          <span id="lc-stage" style="font-size:13px;letter-spacing:0.15em;font-weight:600"></span>
          <span style="font-size:10px;letter-spacing:0.2em;color:#555;font-weight:500">DEATH:</span>
        </div>
        <input type="range" id="lc-scrubber" min="0" max="1" step="0.005" value="${lifecycleT}" style="width:100%;height:6px;cursor:pointer;accent-color:#555;margin:0">
        <div style="position:relative;height:6px;margin-top:1px">
          ${ticksHTML}
        </div>
        <div style="position:relative;height:14px;margin-top:1px">
          ${labelsHTML}
        </div>
      </div>
    `;
    const scrubber = document.getElementById('lc-scrubber');
    const stageLabel = document.getElementById('lc-stage');
    const currentStage = stages.reduce((best, s) => lifecycleT >= s.t ? s : best, stages[0]);
    stageLabel.textContent = currentStage.label;
    stageLabel.style.color = currentStage.color;

    // Pause autoplay while user interacts with scrubber
    scrubber.addEventListener('mousedown', () => { isScrubbing = true; });
    scrubber.addEventListener('touchstart', () => { isScrubbing = true; });
    window.addEventListener('mouseup', () => { isScrubbing = false; });
    window.addEventListener('touchend', () => { isScrubbing = false; });

    scrubber.oninput = e => {
      const v = parseFloat(e.target.value);
      lifecycleT = v;
      updateLifecycle(v);
      const st = stages.reduce((best, s) => v >= s.t ? s : best, stages[0]);
      stageLabel.textContent = st.label;
      stageLabel.style.color = st.color;
    };

    // Stage tick clicks jump to that stage
    document.querySelectorAll('.stage-tick').forEach(el => {
      el.onclick = () => {
        const t = parseFloat(el.dataset.t);
        lifecycleT = t;
        scrubber.value = t;
        updateLifecycle(t);
        stageLabel.textContent = el.dataset.label;
        stageLabel.style.color = el.dataset.color;
      };
    });
  }
}

window.goHome = goHome;
window.goDetail = goDetail;
window.updateLifecycle = updateLifecycle;

window.addEventListener('load', () => {
  render();
  // Refit the canvas on viewport changes — including orientation flips on mobile,
  // which sometimes fire orientationchange before the layout has settled, so we
  // also call onResize on a delay just in case.
  const refit = () => { onResize(); setTimeout(onResize, 120); };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', refit);
});
</script>
</body>
</html>
