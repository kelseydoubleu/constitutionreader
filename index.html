function updateLifecycle(t) {
  lifecycleT = t;

  // ── FALL DEFORMATION (t > 0.82) ──
  // Tilt, drop, and squash the whole model
  if (modelGroup.children[0]) {
    // Find the main content group (last child added is the nest content)
    // Apply deformation to all children
    const fallProgress = ss(0.82, 0.92, t);
    const meltProgress = ss(0.90, 1.0, t);

    modelGroup.traverse(ch => {
      if (ch === modelGroup) return;
      // Only apply fall to non-decomposition elements
      if (ch.userData.lc && ch.userData.lc.appear < 0.85) {
        // Skip — handled by group transform below
      }
    });

    // Apply fall rotation and position to the model group's first-level children
    // Use a subtle tilt + drop
    const nestTilt = fallProgress * 0.4;
    const nestDrop = fallProgress * 6;
    const nestSquash = 1 - meltProgress * 0.5;

    // We modify a wrapper approach - move the whole group
    // Since modelGroup rotates, apply y offset
    modelGroup.position.y = -nestDrop;
    modelGroup.children.forEach(ch => {
      if (ch.userData.lc && ch.userData.lc.appear < 0.85) {
        // These are the nest elements — apply tilt
        // Can't easily rotate individual pieces, so just use position offset
      }
    });
  }

  // ── UPDATE ELEMENT VISIBILITY ──
  lifecycleMeshes.forEach(mesh => {
    const lc = mesh.userData.lc;
    if (!lc) return;

    let opacity = 0;
    if (t < lc.appear) {
      opacity = 0;
    } else if (t < lc.peak) {
      opacity = ss(lc.appear, lc.peak, t);
    } else if (t < lc.fade) {
      opacity = 1;
    } else if (t < lc.gone) {
      opacity = 1 - ss(lc.fade, lc.gone, t);
    } else {
      opacity = 0;
    }

    mesh.visible = opacity > 0.01;

    // Handle different material types
    const mat = mesh.material;
    if (mat) {
      if (!mat.userData) mat.userData = {};
      if (mat.userData.baseOp === undefined) mat.userData.baseOp = mat.opacity !== undefined ? mat.opacity : 1;

      if (mat.isLineBasicMaterial || mat.isPointsMaterial) {
        mat.opacity = mat.userData.baseOp * opacity;
        mat.transparent = true;
      } else if (mat.opacity !== undefined) {
        mat.opacity = mat.userData.baseOp * opacity;
      }
    }

    // For groups (wasps), apply to children
    if (mesh.children) {
      mesh.children.forEach(ch => {
        ch.visible = opacity > 0.01;
        if (ch.material) {
          if (!ch.material.userData) ch.material.userData = {};
          if (ch.material.userData.baseOp === undefined) ch.material.userData.baseOp = ch.material.opacity !== undefined ? ch.material.opacity : 1;
          ch.material.opacity = ch.material.userData.baseOp * opacity;
          if (ch.material.transparent === undefined) ch.material.transparent = true;
        }
      });
    }
  });
}

  const t3Disc = new THREE.CylinderGeometry(2.5, 2.7, 0.06, 6);
  displaceGeo(t3Disc, 0.06, 2, 44);
  tier3.add(new THREE.Mesh(t3Disc, mt('flowDk', { opacity: 0.2 }))).position.y = -0.12;
  for (let q = -4; q <= 4; q++) for (let rr = -4; rr <= 4; rr++) {
    if (Math.abs(q + rr) > 4) continue;
    const x = q * cs * 0.87 + rr * cs * 0.435, z = rr * cs * 0.755;
    if (Math.sqrt(x * x + z * z) > 1.8) continue;
    if (r() > 0.85) continue; // some cells decaying at edges
    tier3.add(new THREE.Mesh(cellGeo, mt('agent', { opacity: 0.2 + r()*0.1 }))).position.set(x, 0, z);
  }
  for (let p = 0; p < 3; p++) {
    const pa = (p / 3) * Math.PI * 2 + r() * 0.5;
    tier3.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
      new THREE.Vector3(Math.cos(pa)*0.5, 1.8, Math.sin(pa)*0.5),
      new THREE.Vector3(Math.cos(pa)*0.3, 0.9, Math.sin(pa)*0.3),
      new THREE.Vector3(Math.cos(pa)*0.4, 0.1, Math.sin(pa)*0.4)
    ]), 6, 0.035, 5, false), mt('agent', { opacity: 0.35 })));
  }
  g.add(tier3);

  // ── OPEN CALDERA ENVELOPE — heat rises out the top, sides protect ──
  // A wasp building a chip would NOT seal it shut — computation generates heat.
  // Open top allows thermal convection. Flared rim. Bowl/ring form.
  for (let l = 0; l < 20; l++) {
    const rad = 4.2 + l * 0.16;
    // Bowl shape — starts at ~40° from horizontal, open top
    const geo = new THREE.SphereGeometry(rad, 44, 32, 0, Math.PI * 2, 0.55, Math.PI * 0.48);
    displaceGeo(geo, 0.1 + l * 0.007, 1.1 + l * 0.12, l * 4.3);

    // Flare the rim outward + tear bottom edges
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const r2 = Math.sqrt(x * x + z * z);

      // Flare top rim outward (where y is highest = rim)
      if (y > rad * 0.15) {
        const flare = 1 + (y / rad - 0.15) * 0.6;
        pos.setX(i, x * flare);
        pos.setZ(i, z * flare);
      }

      // Tear bottom edges
      if (y < -rad * 0.3) {
        const tn = fbm(x * 2 + l, y * 2, z * 2 + l * 0.5);
        pos.setY(i, y - ((-y / rad) - 0.3) * 0.4 * tn * rad * 0.25);
      }
    }
    pos.needsUpdate = true; geo.computeVertexNormals();

    const env = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.12, currentTheme.envSat + 0.05, currentTheme.envelope + 0.02 + l * 0.003),
      transparent: true, opacity: 0.03 + l * 0.003,
      depthWrite: false, side: THREE.DoubleSide, roughness: 0.65
    }));
    env.position.y = -1.5;
    g.add(env);
  }

  // ── INNER RIM DETAIL — thin rings at the flared top edge ──
  for (let i = 0; i < 5; i++) {
    const rimR = 4.8 + i * 0.2;
    const rimGeo = new THREE.TorusGeometry(rimR, 0.02 + i * 0.005, 6, 48);
    displaceGeo(rimGeo, 0.06, 2, i * 17);
    const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.12, currentTheme.envSat, currentTheme.envelope + 0.05),
      transparent: true, opacity: 0.04 + i * 0.005,
      depthWrite: false, side: THREE.DoubleSide, roughness: 0.7
    }));
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.8 + i * 0.15;
    g.add(rim);
  }

  // ── WIDE SUBSTRATE DISC — the platform everything grows on ──
  const wideSub = new THREE.Mesh(
    new THREE.CylinderGeometry(6.5, 7, 0.06, 6),
    mt('flow', { opacity: 0.18 })
  );
  wideSub.position.y = -0.1;
  g.add(wideSub);

  // ── DRAMATIC COOLING RINGS — oversized, floating above ──
  // These are the thermal convection loops — heat rises through the caldera
  // and these rings capture and redirect it back down the sides
  for (let i = 0; i < 6; i++) {
    const ringR = 4 + i * 1.2;
    const ringThick = 0.04 + i * 0.015;
    const ringGeo = new THREE.TorusGeometry(ringR, ringThick, 8, 64);
    displaceGeo(ringGeo, 0.04 + i * 0.01, 1.5, i * 13);
    const ring = new THREE.Mesh(ringGeo, mt('flow', { opacity: 0.22 - i * 0.02 }));
    ring.rotation.x = Math.PI / 2 + (r() - 0.5) * 0.08;
    ring.rotation.z = (r() - 0.5) * 0.05;
    ring.position.y = 2 + i * 1.1;
    g.add(ring);
  }
  // Vertical connectors between rings — heat return paths
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + r() * 0.2;
    const pts = [
      new THREE.Vector3(Math.cos(a) * 4, 2, Math.sin(a) * 4),
      new THREE.Vector3(Math.cos(a) * 6, 4.5, Math.sin(a) * 6),
      new THREE.Vector3(Math.cos(a) * 9, 7.5, Math.sin(a) * 9)
    ];
    g.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, 0.02, 5, false),
      mt('flowLt', { opacity: 0.12 })
    ));
  }

  // ── DECOMPOSITION — previous generation fragments below ──
  for (let i = 0; i < 30; i++) {
    const a = r() * Math.PI * 2, d = r() * 3;
    const frag = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12 + r()*0.08, 0.15, 0.06, 6, 1, true),
      mt(r()>0.5 ? 'time' : 'flow', { opacity: 0.06 + r()*0.06 })
    );
    frag.position.set(Math.cos(a)*d, -5.5 + r()*0.3, Math.sin(a)*d);
    frag.rotation.set(r()*Math.PI, r(), r()*0.5);
    g.add(frag);
  }

  g.position.y = 1;
}


// ═══ MANHATTAN × WASP NEST — dense vertical hex towers, canopy above, open sides ═══
function genManhattanHybrid(g) {
  const r = R(91);
  const cellGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.4, 6, 1, true);
  const capGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.05, 6);

  // ── ORGANIC GROUND — no concrete, living substrate ──
  const groundGeo = new THREE.CylinderGeometry(10, 10.5, 0.12, 6);
  displaceGeo(groundGeo, 0.04, 0.8, 33);
  g.add(new THREE.Mesh(groundGeo, mt('base', { opacity: 0.15 })));

  // ── DENSE TOWER CLUSTERS — "buildings" as vertical hex cell stacks ──
  for (let i = 0; i < 40; i++) {
    const a = r() * Math.PI * 2;
    const d = 0.5 + r() * 7.5;
    if (r() > 1 - (d / 10) * 0.3) continue;
    const tx = Math.cos(a) * d + (r() - 0.5) * 1;
    const tz = Math.sin(a) * d + (r() - 0.5) * 1;
    const dist = Math.sqrt(tx * tx + tz * tz);
    const maxH = Math.max(1, 8 - dist * 0.6 + (r() - 0.5) * 3);
    const numFloors = Math.floor(1 + r() * maxH);
    const towerR = 0.3 + r() * 0.4;
    for (let f = 0; f < numFloors; f++) {
      const numCells = f < numFloors * 0.7 ? Math.floor(3 + r() * 4) : Math.max(1, Math.floor((numFloors - f) * 1.5));
      for (let ci = 0; ci < numCells; ci++) {
        const ca = (ci / numCells) * Math.PI * 2 + f * 0.1;
        const cd = ci === 0 ? 0 : towerR * (0.4 + r() * 0.3);
        const cx = tx + Math.cos(ca) * cd;
        const cz = tz + Math.sin(ca) * cd;
        const cell = new THREE.Mesh(cellGeo, mt('agent', { opacity: 0.3 - dist * 0.015 }));
        cell.position.set(cx, 0.2 + f * 0.42, cz);
        cell.rotation.y = r() * 0.15;
        g.add(cell);
        if (r() > 0.5) {
          g.add(new THREE.Mesh(capGeo, mt('time', { opacity: 0.35 }))).position.set(cx, 0.42 + f * 0.42, cz);
        }
      }
    }
  }

  // ── WINDING PATHS ──
  for (let i = 0; i < 18; i++) {
    const a0 = r() * Math.PI * 2, len = 3 + r() * 6;
    const pts = [];
    for (let s = 0; s < 8; s++) {
      const t = s / 7;
      pts.push(new THREE.Vector3(Math.cos(a0 + (r()-0.5)*t*1.2) * t * len, 0.1, Math.sin(a0 + (r()-0.5)*t*1.2) * t * len));
    }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 14, 0.05, 5, false), mt('agentLt', { opacity: 0.2 })));
  }

  // ── SHALLOW ROOTS — temporary ──
  for (let i = 0; i < 12; i++) {
    const a = r() * Math.PI * 2, d = 1 + r() * 6;
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
      new THREE.Vector3(Math.cos(a)*d, 0, Math.sin(a)*d),
      new THREE.Vector3(Math.cos(a)*d*0.7, -0.4, Math.sin(a)*d*0.7),
      new THREE.Vector3(Math.cos(a)*d*0.4, -0.7, Math.sin(a)*d*0.4)
    ]), 6, 0.02, 4, false), mt('flow', { opacity: 0.12 })));
  }

  // ── CANOPY ENVELOPE — closed top, open sides (street access) ──
  for (let l = 0; l < 18; l++) {
    const rad = 10 + l * 0.18;
    const geo = new THREE.SphereGeometry(rad, 44, 28, 0, Math.PI * 2, 0, Math.PI * 0.38);
    displaceGeo(geo, 0.08 + l * 0.006, 0.8 + l * 0.1, l * 6.1);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      if (y < rad * 0.7) {
        const tn = fbm(pos.getX(i)*1.5+l, y+l, pos.getZ(i)*1.5);
        const rimDist = (rad*0.7 - y) / rad;
        pos.setY(i, y + rimDist * tn * rad * 0.15);
        const flare = 1 + rimDist * 0.3;
        pos.setX(i, pos.getX(i) * flare);
        pos.setZ(i, pos.getZ(i) * flare);
      }
    }
    pos.needsUpdate = true; geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.12, currentTheme.envSat, currentTheme.envelope+0.04+l*0.004),
      transparent:true, opacity:0.025+l*0.002, depthWrite:false, side:THREE.DoubleSide, roughness:0.65
    }))).position.y = 1;
  }

  // ── DECOMPOSITION RING ──
  for (let i = 0; i < 35; i++) {
    const a = r()*Math.PI*2, d = 7+r()*3;
    const frag = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.06,6,1,true), mt(r()>0.5?'time':'agent',{opacity:0.06+r()*0.06}));
    frag.position.set(Math.cos(a)*d, r()*0.3, Math.sin(a)*d);
    frag.rotation.set(r()*Math.PI, r(), r());
    g.add(frag);
  }
  g.position.y = -0.5;
}

// ═══ CONVERGENCE — compute calderas under perforated district canopy ═══
function genConvergence(g) {
  const r = R(137);
  const cellGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.35, 6, 1, true);
  const capGeo = new THREE.CylinderGeometry(0.17, 0.17, 0.04, 6);

  const groundGeo = new THREE.CylinderGeometry(12, 12.5, 0.1, 6);
  displaceGeo(groundGeo, 0.03, 0.5, 55);
  g.add(new THREE.Mesh(groundGeo, mt('base', { opacity: 0.12 })));

  // ── 7 COMPUTE CLUSTERS with caldera envelopes ──
  const clusters = [[0, 0, 1.4]];
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2 + r()*0.3;
    clusters.push([Math.cos(a)*(5+r()*2), Math.sin(a)*(5+r()*2), 0.6+r()*0.4]);
  }
  const calderaPositions = [];

  clusters.forEach(([cx, cz, scale], idx) => {
    calderaPositions.push([cx, cz, 2.5*scale]);
    const subGeo = new THREE.CylinderGeometry(2*scale, 2.1*scale, 0.06, 6);
    displaceGeo(subGeo, 0.04, 2, idx*11);
    g.add(new THREE.Mesh(subGeo, mt('flow',{opacity:0.18}))).position.set(cx, 0.06, cz);

    const combR = 1.5*scale, cs = 0.42;
    for (let q=-Math.ceil(combR/cs); q<=Math.ceil(combR/cs); q++) {
      for (let rr=-Math.ceil(combR/cs); rr<=Math.ceil(combR/cs); rr++) {
        if (Math.abs(q+rr)>Math.ceil(combR/cs)) continue;
        const x=q*cs*0.87+rr*cs*0.435, z=rr*cs*0.755;
        if (Math.sqrt(x*x+z*z)>combR) continue;
        const n=fbm(x*2+idx*10,z*2,0); if(n<0.3) continue;
        g.add(new THREE.Mesh(cellGeo, mt('agent',{opacity:0.3+n*0.1}))).position.set(cx+x,0.2,cz+z);
        if(r()>0.45) g.add(new THREE.Mesh(capGeo, mt('time',{opacity:0.4}))).position.set(cx+x,0.4,cz+z);
      }
    }

    for (let si=0; si<3; si++) {
      const sa=(si/3)*Math.PI*2+r()*0.5, sd=combR*0.8;
      const sx=cx+Math.cos(sa)*sd, sz2=cz+Math.sin(sa)*sd;
      for (let layer=0; layer<5; layer++) for (let ci=0; ci<5; ci++) {
        const ca=(ci/5)*Math.PI*2, cd=ci===0?0:0.15;
        g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.03,6), mt(layer%2===0?'flow':'flowLt',{opacity:0.3}))).position.set(sx+Math.cos(ca)*cd, 0.15+layer*0.035, sz2+Math.sin(ca)*cd);
      }
    }

    // Per-cluster caldera (open top, 10 layers)
    for (let l=0; l<10; l++) {
      const cRad = 2.5*scale + l*0.1;
      const cGeo = new THREE.SphereGeometry(cRad, 32, 22, 0, Math.PI*2, 0.5, Math.PI*0.5);
      displaceGeo(cGeo, 0.08+l*0.006, 1+l*0.15, l*7+idx*30);
      const cPos = cGeo.attributes.position;
      for (let i=0; i<cPos.count; i++) {
        const y=cPos.getY(i);
        if (y>cRad*0.1) { const flare=1+(y/cRad-0.1)*0.4; cPos.setX(i,cPos.getX(i)*flare); cPos.setZ(i,cPos.getZ(i)*flare); }
      }
      cPos.needsUpdate=true; cGeo.computeVertexNormals();
      g.add(new THREE.Mesh(cGeo, new THREE.MeshStandardMaterial({
        color:new THREE.Color().setHSL(0.12,currentTheme.envSat+0.03,currentTheme.envelope+0.03+l*0.004),
        transparent:true, opacity:0.025+l*0.003, depthWrite:false, side:THREE.DoubleSide, roughness:0.65
      }))).position.set(cx, -0.2, cz);
    }
  });

  // ── PATHS ──
  for (let i=0; i<12; i++) {
    const a0=r()*Math.PI*2, len=4+r()*7, pts=[];
    for (let s=0; s<8; s++) { const t=s/7; pts.push(new THREE.Vector3(Math.cos(a0+(r()-0.5)*t*0.5)*t*len, 0.08, Math.sin(a0+(r()-0.5)*t*0.5)*t*len)); }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),12,0.04,4,false), mt('agentLt',{opacity:0.18})));
  }

  // ── MYCELIUM ──
  clusters.forEach(([cx1,cz1],i) => {
    if(i===0) return;
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
      new THREE.Vector3(cx1,0.05,cz1), new THREE.Vector3(cx1*0.5+(r()-0.5)*0.5,-0.2,cz1*0.5+(r()-0.5)*0.5), new THREE.Vector3(0,0.05,0)
    ]),8,0.02,4,false), mt('flowLt',{opacity:0.15})));
  });

  // ── PERFORATED DISTRICT CANOPY — holes above each caldera ──
  for (let l=0; l<14; l++) {
    const rad = 12+l*0.16;
    const geo = new THREE.SphereGeometry(rad, 48, 32, 0, Math.PI*2, 0, Math.PI*0.32);
    displaceGeo(geo, 0.06+l*0.005, 0.6+l*0.08, l*5.5);
    const pos = geo.attributes.position;
    for (let i=0; i<pos.count; i++) {
      const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
      for (const [ccx,ccz,ccr] of calderaPositions) {
        const dx=x-ccx, dz=z-ccz, hDist=Math.sqrt(dx*dx+dz*dz);
        if (hDist < ccr*1.2) {
          const pushFactor = 1+(1-hDist/(ccr*1.2))*0.8;
          const angle = Math.atan2(dz,dx);
          pos.setX(i, ccx+Math.cos(angle)*hDist*pushFactor);
          pos.setZ(i, ccz+Math.sin(angle)*hDist*pushFactor);
          pos.setY(i, y-(1-hDist/(ccr*1.2))*1.5);
        }
      }
      if (y<rad*0.85) {
        const tn=fbm(x*1.2+l,y+l,z*1.2), rimDist=(rad*0.85-y)/rad;
        pos.setY(i, y+rimDist*tn*rad*0.1);
        pos.setX(i, pos.getX(i)*(1+rimDist*0.2));
        pos.setZ(i, pos.getZ(i)*(1+rimDist*0.2));
      }
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(0.11,currentTheme.envSat+0.02,currentTheme.envelope+0.03+l*0.003),
      transparent:true, opacity:0.02+l*0.002, depthWrite:false, side:THREE.DoubleSide, roughness:0.6
    }))).position.y = 2;
  }

  // ── DECOMPOSITION ──
  for (let i=0; i<45; i++) {
    const a=r()*Math.PI*2, d=9+r()*3;
    const frag = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.04,6,1,true), mt(r()>0.5?'time':r()>0.5?'agent':'flow',{opacity:0.05+r()*0.06}));
    frag.position.set(Math.cos(a)*d, r()*0.2, Math.sin(a)*d);
    frag.rotation.set(r()*Math.PI, r(), r());
    g.add(frag);
  }
  g.position.y = -0.3;
}

// ═══ THREE.JS ═══
let scene, camera, renderer, modelGroup;
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
let sectionEnabled = false;

// Camera control state
let camRotY = 0.8, camRotX = 0.4;
let camZoom = 11;
let camPanX = 0, camPanY = 0;
let camTarget = [0, 0, 0];
let isDragging = false, isPanning = false;
let dragStart = { x: 0, y: 0 };
let autoRotate = true;
let autoRotSpeed = 0.002;
let elapsed = 0;

function initThree() {
  const vp = document.getElementById('viewport');
  if (!vp) return;
  scene = new THREE.Scene(); scene.background = new THREE.Color(currentTheme.bg);
  camera = new THREE.OrthographicCamera(-10,10,7.5,-7.5,-100,300);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.sortObjects = true; renderer.localClippingEnabled = true;
  vp.innerHTML = ''; vp.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.75));
  [[10,18,10,0.5],[-8,10,-6,0.2],[0,5,15,0.15]].forEach(([x,y,z,i])=>{const d=new THREE.DirectionalLight(0xffffff,i);d.position.set(x,y,z);scene.add(d);});
  modelGroup = new THREE.Group(); scene.add(modelGroup);

  // Event listeners
  const canvas = renderer.domElement;
  canvas.style.cursor = 'grab';

  canvas.addEventListener('mousedown', e => {
    if (e.shiftKey || e.button === 2) { isPanning = true; } else { isDragging = true; }
    dragStart = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = isPanning ? 'move' : 'grabbing';
    autoRotate = false;
  });

  canvas.addEventListener('mousemove', e => {
    if (isDragging) {
      const dx = (e.clientX - dragStart.x) * 0.005;
      const dy = (e.clientY - dragStart.y) * 0.005;
      camRotY += dx;
      camRotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camRotX + dy));
      dragStart = { x: e.clientX, y: e.clientY };
      updateCamera();
    }
    if (isPanning) {
      const dx = (e.clientX - dragStart.x) * 0.02;
      const dy = (e.clientY - dragStart.y) * 0.02;
      camPanX -= dx;
      camPanY += dy;
      dragStart = { x: e.clientX, y: e.clientY };
      updateCamera();
    }
  });

  canvas.addEventListener('mouseup', () => {
    isDragging = false; isPanning = false;
    canvas.style.cursor = 'grab';
    // Resume auto-rotate after 2 seconds
    setTimeout(() => { if (!isDragging) autoRotate = true; }, 2000);
  });

  canvas.addEventListener('mouseleave', () => {
    isDragging = false; isPanning = false;
    canvas.style.cursor = 'grab';
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camZoom = Math.max(3, Math.min(25, camZoom + (e.deltaY > 0 ? 0.8 : -0.8)));
    updateCamera();
  }, { passive: false });

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // Touch support
  let lastTouchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      isDragging = false;
      lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
    autoRotate = false;
  });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = (e.touches[0].clientX - dragStart.x) * 0.005;
      const dy = (e.touches[0].clientY - dragStart.y) * 0.005;
      camRotY += dx;
      camRotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camRotX + dy));
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateCamera();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      camZoom = Math.max(3, Math.min(25, camZoom + (lastTouchDist - dist) * 0.05));
      lastTouchDist = dist;
      updateCamera();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    isDragging = false;
    setTimeout(() => { if (!isDragging) autoRotate = true; }, 2000);
  });

  onResize();

  (function animate() {
    requestAnimationFrame(animate);
    elapsed += 0.016;
    if (autoRotate) { camRotY += autoRotSpeed; updateCamera(); }
    // Wasp animation
    animatedWasps.forEach(w => {
      if (!w.mesh.visible) return;
      const o = w.orbit, t = elapsed * o.speed + o.phase;
      w.mesh.position.set(Math.cos(t) * o.radius, o.height + Math.sin(elapsed * o.bobSpeed + o.phase) * o.bobAmount, Math.sin(t) * o.radius);
      w.mesh.rotation.y = -t + Math.PI / 2; w.mesh.rotation.x = o.tilt;
      if (w.mesh.children[2]) w.mesh.children[2].rotation.z = 0.2 + Math.sin(elapsed * 25 + o.phase) * 0.3;
      if (w.mesh.children[3]) w.mesh.children[3].rotation.z = -0.2 - Math.sin(elapsed * 25 + o.phase) * 0.3;
    });
    renderer.render(scene, camera);
  })();
}

function updateCamera() {
  if (!camera) return;
  const dist = 20;
  const x = Math.sin(camRotY) * Math.cos(camRotX) * dist;
  const y = Math.sin(camRotX) * dist;
  const z = Math.cos(camRotY) * Math.cos(camRotX) * dist;
  camera.position.set(x + camPanX, y + camPanY, z);
  camera.lookAt(camPanX + camTarget[0], camPanY + camTarget[1], camTarget[2]);

  const vp = document.getElementById('viewport');
  if (!vp) return;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (w === 0 || h === 0) return;
  const a = w / h;
  camera.left = -camZoom * a; camera.right = camZoom * a;
  camera.top = camZoom; camera.bottom = -camZoom;
  camera.updateProjectionMatrix();
}

function onResize() {
  const vp = document.getElementById('viewport');
  if (!vp || !renderer) return;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h);
  updateCamera();
}

function loadModel(key) {
  if (!modelGroup) return;
  while (modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
  animatedWasps = [];
  lifecycleMeshes = [];
  scene.background = new THREE.Color(currentTheme.bg);
  const spec = SPECS[key];
  if (spec) {
    spec.fn(modelGroup);
    applyMode();
    if (sectionEnabled) applySection();
    // Reset camera to spec defaults
    camTarget = spec.tgt || [0, 0, 0];
    camPanX = 0; camPanY = 0;
    // Derive rotation from cam position
    const c = spec.cam;
    camRotY = Math.atan2(c[0], c[2]);
    camRotX = Math.atan2(c[1], Math.sqrt(c[0] * c[0] + c[2] * c[2]));
    updateCamera();
  }
}

function applyMode() {
  const toRemove = [];
  modelGroup.traverse(ch => { if(ch.userData._modeOverlay) toRemove.push(ch); });
  toRemove.forEach(ch => ch.parent.remove(ch));
  lifecycleMeshes = lifecycleMeshes.filter(m => !m.userData._modeOverlay);
  modelGroup.traverse(ch => { if(ch.isMesh && ch.userData._hidden) { ch.visible=true; ch.userData._hidden=false; } });
  if (currentMode === 'xray') return;
  const isDark = currentTheme.bg < 0x888888;
  const edgeColor = isDark ? 0x888888 : 0x333333;
  if (currentMode === 'ghosted') {
    modelGroup.traverse(ch => {
      if(!ch.isMesh||!ch.geometry) return;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(ch.geometry,15), new THREE.LineBasicMaterial({color:edgeColor,transparent:true,opacity:0.15}));
      edges.position.copy(ch.position);edges.rotation.copy(ch.rotation);edges.scale.copy(ch.scale);
      edges.userData._modeOverlay=true;
      if(ch.userData.lc){edges.userData.lc=ch.userData.lc;lifecycleMeshes.push(edges);}
      ch.parent.add(edges);
    });
  }
}

function applySection() {
  modelGroup.traverse(ch => {
    if(ch.isMesh && ch.material) {
      ch.material.clippingPlanes = sectionEnabled ? [clipPlane] : [];
      ch.material.needsUpdate = true;
    }
  });
}

      const vp = document.getElementById('viewport');
      if (vp && !vp.querySelector('canvas')) vp.appendChild(renderer.domElement);
      onResize();

}

function scoreBar(scores) {
  const total = (scores.death + scores.waste + scores.labor + scores.supply) / 4;
  const pct = Math.round(total * 10);
  return `<span style="font-size:13px;letter-spacing:0.1em;color:${pct>6?'#33DD33':pct>3?'#FFB830':'#E91E8C'}">${pct}/10</span>`;
}

function scoreDetail(scores) {
  const items = [['DEATH PLAN',scores.death],['WASTE',scores.waste],['LABOR',scores.labor],['SUPPLY',scores.supply]];
  return items.map(([k,v])=>`<span style="color:${v>6?'#33DD33':v>3?'#FFB830':'#E91E8C'}">${k}: ${v}/10</span>`).join('  ');
}

      <div class="detail">
        <div class="detail-header">
          <div style="display:flex;align-items:baseline">
            <span class="detail-name">${spec.name}</span>
            <span class="detail-arch">${spec.arch}</span>
            <span style="margin-left:16px;font-size:9px;color:#555">${scoreDetail(scores)}</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            ${!isLC && breeding && breeding.partners.length > 0 ? `<button class="crossbreed-btn" onclick="openCrossbreed()">× CROSS-BREED</button>` : ''}
            ${currentKey === 'wasp_nest' ? `<button class="style-btn" onclick="goDetail('lifecycle')">LIFECYCLE</button>` : ''}
          </div>
        </div>
        <div class="style-bar" id="stylebar"></div>
        ${isLC ? '' : `<div class="col-headers"><span style="color:#555">WHAT IT CAME FROM:</span><span style="color:#888">WHAT IT IS NOW:</span><span style="color:#555">WHAT IT WILL BECOME:</span></div>`}
        <div class="triptych" id="triptych">
          <div class="model-wrap" style="width:${isLC?'70%':'35%'}"><div id="viewport"></div></div>
          <svg id="lines-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none"></svg>
          <div class="rows" id="rows"></div>
        </div>
        <div class="divider"></div>
        <div class="bottom" id="bottom-section"></div>
      </div>
    `;

    renderStyleBar();
    renderRows(spec, isLC);
    renderBottom(spec, isLC);
  }
}

function renderStyleBar() {
  const bar = document.getElementById('stylebar');
  if (!bar) return;
  bar.innerHTML = '';
  // View
  const vLabel = document.createElement('span'); vLabel.style.cssText='font-size:9px;letter-spacing:0.12em;color:#666;text-transform:uppercase'; vLabel.textContent='VIEW:'; bar.appendChild(vLabel);
  [['constitutional','CONSTITUTIONAL'],['monochrome','MONOCHROME']].forEach(([k,label])=>{
    const btn = document.createElement('button'); btn.className='style-btn'+(currentTheme===THEMES[k]?' active':''); btn.textContent=label;
    btn.onclick=()=>{currentTheme=THEMES[k];if(currentKey)goDetail(currentKey);}; bar.appendChild(btn);
  });
  // Sep
  const sep = document.createElement('span'); sep.style.cssText='width:1px;height:10px;background:#ddd;margin:0 6px'; bar.appendChild(sep);
  // Mode
  const mLabel = document.createElement('span'); mLabel.style.cssText='font-size:9px;letter-spacing:0.12em;color:#666;text-transform:uppercase'; mLabel.textContent='MODE:'; bar.appendChild(mLabel);
  [['xray','X-RAY'],['ghosted','GHOSTED']].forEach(([k,label])=>{
    const btn = document.createElement('button'); btn.className='style-btn'+(currentMode===k?' active':''); btn.textContent=label;
    btn.onclick=()=>{currentMode=k;if(currentKey){loadModel(currentKey);}}; bar.appendChild(btn);
  });
  // Sep
  const sep2 = document.createElement('span'); sep2.style.cssText='width:1px;height:10px;background:#ddd;margin:0 6px'; bar.appendChild(sep2);
  // Section
  const secBtn = document.createElement('button'); secBtn.className='style-btn'+(sectionEnabled?' active':''); secBtn.textContent='SECTION';
  secBtn.onclick=()=>{sectionEnabled=!sectionEnabled;applySection();renderStyleBar();}; bar.appendChild(secBtn);
  if (sectionEnabled) {
    const slider = document.createElement('input'); slider.type='range'; slider.min='-8'; slider.max='8'; slider.step='0.1'; slider.value=clipPlane.constant;
    slider.style.cssText='width:60px;height:3px;accent-color:#555;cursor:pointer;margin-left:4px';
    slider.oninput=e=>{clipPlane.constant=parseFloat(e.target.value);}; bar.appendChild(slider);
  }
}

function renderRows(spec, isLC) {
  const rowsEl = document.getElementById('rows');
  if (!rowsEl || isLC) return;
  rowsEl.innerHTML = '';
  spec.rows.forEach(row => {
    const c = COLORS[row.cat];
    const allVoid = row.right.every(t=>t.includes('?'));
    const wrap = document.createElement('div'); wrap.className='row-wrap'; wrap.dataset.color=c; wrap.dataset.void=allVoid?'true':'false';
    const label = document.createElement('div'); label.className='row-label'; label.style.color=c; label.textContent=row.label; wrap.appendChild(label);
    const strip = document.createElement('div'); strip.className='strip';
    const leftG = document.createElement('div'); leftG.className='panel-group panel-left'; leftG.style.border=`1px solid ${c}`;
    row.left.forEach(t=>{const lines=t.split('\n');const cell=document.createElement('div');cell.className='cell';cell.style.border=`1px solid ${c}`;cell.innerHTML=`<div class="cell-title" style="color:${c}">${lines[0]}</div>${lines[1]?`<div class="cell-desc">${lines[1]}</div>`:''}`;leftG.appendChild(cell);});
    strip.appendChild(leftG);
    strip.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
    const rightG = document.createElement('div'); rightG.className='panel-group panel-right'; rightG.style.border=`1px solid ${allVoid?'#ddd':c}`;
    row.right.forEach(t=>{const isEmpty=t.includes('?');const lines=t.split('\n');const cell=document.createElement('div');cell.className='cell';cell.style.border=`1px solid ${isEmpty?'#e0e0e0':c}`;cell.style.background=isEmpty?'#fafafb':'#fff';if(isEmpty){cell.innerHTML=`<div class="cell-title" style="color:#777">${lines[0]}</div><div class="cell-void">?</div>`;}else{cell.innerHTML=`<div class="cell-title" style="color:${c}">${lines[0]}</div>${lines[1]?`<div class="cell-desc">${lines[1]}</div>`:''}`;}rightG.appendChild(cell);});
    strip.appendChild(rightG);
    wrap.appendChild(strip); rowsEl.appendChild(wrap);
  });
}

function renderBottom(spec, isLC) {
  const el = document.getElementById('bottom-section');
  if (!el) return;
  if (isLC) {
    const stages=[{t:0,label:'RAW MATERIALS',color:'#E91E8C'},{t:0.12,label:'HARVEST',color:'#33DD33'},{t:0.22,label:'FIRST BUILD',color:'#33DD33'},{t:0.38,label:'GROWTH',color:'#E91E8C'},{t:0.55,label:'PEAK COLONY',color:'#FFB830'},{t:0.72,label:'DECLINE',color:'#FFB830'},{t:0.82,label:'ABANDON',color:'#888'},{t:0.88,label:'FALL',color:'#888'},{t:0.93,label:'DECOMPOSE',color:'#E91E8C'},{t:1.0,label:'RETURN',color:'#E91E8C'}];
    el.innerHTML=`<div style="padding:4px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:10px;letter-spacing:0.2em;color:#555;font-weight:500">LIFESPAN:</span><span id="lc-stage" style="font-size:13px;letter-spacing:0.15em;font-weight:600"></span><span style="font-size:10px;letter-spacing:0.2em;color:#555;font-weight:500">DEATH:</span></div><input type="range" id="lc-scrubber" min="0" max="1" step="0.005" value="${lifecycleT}" style="width:100%;height:6px;cursor:pointer;accent-color:#555;margin:0"><div style="display:flex;justify-content:space-between;margin-top:3px">${stages.map(s=>`<span style="font-size:8px;letter-spacing:0.06em;color:${s.color};text-transform:uppercase;cursor:pointer" onclick="document.getElementById('lc-scrubber').value=${s.t};updateLifecycle(${s.t});document.getElementById('lc-stage').textContent='${s.label}';document.getElementById('lc-stage').style.color='${s.color}'">${s.label}</span>`).join('')}</div></div>`;
    const scrubber=document.getElementById('lc-scrubber'),stageLabel=document.getElementById('lc-stage');
    const currentStage=stages.reduce((best,s)=>lifecycleT>=s.t?s:best,stages[0]);
    stageLabel.textContent=currentStage.label;stageLabel.style.color=currentStage.color;
    scrubber.oninput=e=>{const v=parseFloat(e.target.value);updateLifecycle(v);const st=stages.reduce((best,s)=>v>=s.t?s:best,stages[0]);stageLabel.textContent=st.label;stageLabel.style.color=st.color;};
  } else {
    el.innerHTML=`<div class="bottom-grid"><div><div class="section-label">MANIFESTO:</div><div class="manifesto-text">${spec.manifesto}</div></div><div><div class="section-label">VALUE SYSTEM LEDGER:</div><div id="ledger"></div></div></div>`;
    const ledgerEl=document.getElementById('ledger');
    if(ledgerEl) spec.ledger.forEach(([k,v,hl])=>{const row=document.createElement('div');row.className='ledger-row'+(hl?' hl':'');row.innerHTML=`<div class="ledger-key">${k}</div><div class="ledger-val">${v}</div>`;ledgerEl.appendChild(row);});
  }
}

// ═══ CROSSBREED MODAL ═══
function renderCrossbreedModal() {
  const el = document.getElementById('modal-content');
  const breeding = BREEDING[currentKey];
  if (!breeding) return;
  let cards = '';
  // Show available partners
  breeding.partners.forEach(pk => {
    const pSpec = SPECS[pk];
    const resultKey = breeding.results[pk];
    cards += `<div class="modal-card" onclick="closeCrossbreed();goDetail('${resultKey}')"><div class="modal-card-name">${pSpec.name}</div><div class="modal-card-sub">→ ${SPECS[resultKey].name}</div></div>`;
  });
  // Show grayed-out unavailable ones
  const unavailable = BASE_SPECIMENS.filter(k => k !== currentKey && !breeding.partners.includes(k));
  unavailable.forEach(k => {
    if (k === 'wasp_nest' && !BASE_SPECIMENS.includes(currentKey)) return;
    cards += `<div class="modal-card disabled"><div class="modal-card-name">${SPECS[k]?.name || k}</div><div class="modal-card-sub">COMING SOON</div></div>`;
  });
  el.innerHTML = `<div class="modal-title">CROSS-BREED ${SPECS[currentKey].name} WITH:</div><div class="modal-cards">${cards}</div><button class="modal-close" onclick="closeCrossbreed()">CANCEL</button>`;
}

// ═══ FAMILY TREE ═══
function renderTree() {
  const svg = document.getElementById('tree-svg');
  if (!svg) return;
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  // Nodes
  const nodes = {
    wasp_nest: { x:400, y:60, label:'WASP NEST', score:VALUE_SCORES.wasp_nest },
    h100: { x:200, y:60, label:'NVIDIA H100', score:VALUE_SCORES.h100 },
    manhattan: { x:600, y:60, label:'MANHATTAN GRID', score:VALUE_SCORES.manhattan },
    hybrid: { x:250, y:220, label:'H100 × WASP NEST', score:VALUE_SCORES.hybrid },
    manhattan_hybrid: { x:550, y:220, label:'MANHATTAN × WASP NEST', score:VALUE_SCORES.manhattan_hybrid },
    h100_manhattan: { x:400, y:220, label:'H100 × MANHATTAN', score:null },
    convergence: { x:400, y:380, label:'SEASONAL DATA CENTER', score:VALUE_SCORES.convergence },
  };

  // Edges
  const edges = [
    { from:'h100', to:'hybrid', color:'#E91E8C', solid:true },
    { from:'wasp_nest', to:'hybrid', color:'#33DD33', solid:true },
    { from:'manhattan', to:'manhattan_hybrid', color:'#E91E8C', solid:true },
    { from:'wasp_nest', to:'manhattan_hybrid', color:'#33DD33', solid:true },
    { from:'h100', to:'h100_manhattan', color:'#ccc', solid:false },
    { from:'manhattan', to:'h100_manhattan', color:'#ccc', solid:false },
    { from:'hybrid', to:'convergence', color:'#E91E8C', solid:true },
    { from:'manhattan_hybrid', to:'convergence', color:'#33DD33', solid:true },
  ];

  // Draw edges
  edges.forEach(e => {
    const f = nodes[e.from], t = nodes[e.to];
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', f.x); line.setAttribute('y1', f.y + 20);
    line.setAttribute('x2', t.x); line.setAttribute('y2', t.y - 20);
    line.setAttribute('stroke', e.color); line.setAttribute('stroke-width', e.solid ? '1.5' : '1');
    if (!e.solid) line.setAttribute('stroke-dasharray', '4 3');
    line.setAttribute('opacity', e.solid ? '0.5' : '0.25');
    svg.appendChild(line);
  });

  // Draw nodes
  Object.entries(nodes).forEach(([key, n]) => {
    const exists = n.score !== null;
    const g = document.createElementNS(ns, 'g');
    g.style.cursor = exists ? 'pointer' : 'default';
    if (exists) g.onclick = () => { toggleTree(); goDetail(key); };

    // Box
    const rect = document.createElementNS(ns, 'rect');
    const w = 140, h = 36;
    rect.setAttribute('x', n.x - w/2); rect.setAttribute('y', n.y - h/2);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('fill', '#fff'); rect.setAttribute('stroke', exists ? '#1a1a1a' : '#ddd');
    rect.setAttribute('stroke-width', '1');
    if (!exists) rect.setAttribute('stroke-dasharray', '3 2');
    g.appendChild(rect);

    // Label
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', n.x); text.setAttribute('y', n.y - 2);
    text.setAttribute('text-anchor', 'middle'); text.setAttribute('font-family', "'Spline Sans Mono',monospace");
    text.setAttribute('font-size', '7'); text.setAttribute('letter-spacing', '0.12em');
    text.setAttribute('fill', exists ? '#1a1a1a' : '#ccc'); text.setAttribute('font-weight', '600');
    text.textContent = n.label;
    g.appendChild(text);

    // Score
    if (n.score) {
      const total = Math.round((n.score.death+n.score.waste+n.score.labor+n.score.supply)/4*10)/10;
      const scoreText = document.createElementNS(ns, 'text');
      scoreText.setAttribute('x', n.x); scoreText.setAttribute('y', n.y + 11);
      scoreText.setAttribute('text-anchor', 'middle'); scoreText.setAttribute('font-family', "'Spline Sans Mono',monospace");
      scoreText.setAttribute('font-size', '6'); scoreText.setAttribute('letter-spacing', '0.1em');
      scoreText.setAttribute('fill', total>6?'#33DD33':total>3?'#FFB830':'#E91E8C');
      scoreText.textContent = `${total}/10`;
      g.appendChild(scoreText);
    } else {
      const coming = document.createElementNS(ns, 'text');
      coming.setAttribute('x', n.x); coming.setAttribute('y', n.y + 11);
      coming.setAttribute('text-anchor', 'middle'); coming.setAttribute('font-family', "'Spline Sans Mono',monospace");
      coming.setAttribute('font-size', '5.5'); coming.setAttribute('fill', '#ddd');
      coming.textContent = 'COMING SOON';
      g.appendChild(coming);
    }

    svg.appendChild(g);
  });

  // Generation labels
  [['GENERATION 0', 40], ['GENERATION 1', 200], ['GENERATION 2', 360]].forEach(([label, y]) => {
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', 30); t.setAttribute('y', y);
    t.setAttribute('font-family', "'Spline Sans Mono',monospace"); t.setAttribute('font-size', '6');
    t.setAttribute('fill', '#ddd'); t.setAttribute('letter-spacing', '0.1em');
    t.textContent = label;
    svg.appendChild(t);
  });
}

// Make functions available globally
window.goHome = goHome;
window.goDetail = goDetail;
window.toggleTree = toggleTree;
window.openCrossbreed = openCrossbreed;
window.closeCrossbreed = closeCrossbreed;
window.updateLifecycle = updateLifecycle;

// ═══ INIT ═══
window.addEventListener('load', () => {
  render();
  window.addEventListener('resize', () => { onResize(); });
});
</script>
</body>
</html>
